                    {showCommentModal && <CommentModal news={news} onClose={() => setShowCommentModal(false)} />}
                </article>
            );
        };
        
        // ==========================================
        // NEWS DETAIL MODAL
        // ==========================================
        const NewsDetailModal = ({ news, onClose }) => {
            const { t } = useTranslation();
            const { user } = useAuth();
            const { addNotification } = useNotifications();
            const userData = useContext(UserDataContext);
            const isLiked = userData.likedPosts.includes(news.id);
            const isSaved = userData.savedPosts.includes(news.id);
            const [likes, setLikes] = useState(news.likes || 0);
            const [shareOpen, setShareOpen] = useState(false);
            const [commentCount, setCommentCount] = useState(news.commentCount || 0);

            useEffect(() => {
                const onKey = e => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                document.body.style.overflow = 'hidden';
                return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
            }, []);

            // sync likes/commentCount real-time
            useEffect(() => {
                const unsub = db.collection('news').doc(news.id).onSnapshot(snap => {
                    if (snap.exists) { const d = snap.data(); setLikes(d.likes||0); setCommentCount(d.commentCount||0); }
                }, ()=>{});
                return () => unsub();
            }, [news.id]);

            useEffect(() => {
                const tid = setTimeout(() => {
                    db.collection('news').doc(news.id).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
                }, 2000);
                return () => clearTimeout(tid);
            }, [news.id]);

            const handleLike = async () => {
                if (!user) { addNotification({ message: '🔐 Login to like', type: 'info' }); return; }
                const nr = db.collection('news').doc(news.id);
                const ur = db.collection('users').doc(user.uid);
                if (isLiked) {
                    await nr.update({ likes: firebase.firestore.FieldValue.increment(-1) }).catch(()=>{});
                    await ur.update({ likedPosts: firebase.firestore.FieldValue.arrayRemove(news.id) }).catch(()=>{});
                } else {
                    await nr.update({ likes: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
                    await ur.update({ likedPosts: firebase.firestore.FieldValue.arrayUnion(news.id) }).catch(()=>{});
                }
            };

            const handleSave = async () => {
                if (!user) { addNotification({ message: '🔐 Login to save', type: 'info' }); return; }
                const ur = db.collection('users').doc(user.uid);
                if (isSaved) { await ur.update({ savedPosts: firebase.firestore.FieldValue.arrayRemove(news.id) }).catch(()=>{}); addNotification({ message: 'Removed from saved', type:'success' }); }
                else { await ur.update({ savedPosts: firebase.firestore.FieldValue.arrayUnion(news.id) }).catch(()=>{}); addNotification({ message: '✅ Saved!', type:'success' }); }
            };

            const doShare = async (platform) => {
                const url  = `https://kwtnews.com/news/${news.id}`;
                const text = `📰 ${news.title}\n\n🔗 ${url}\nVia KWT News - kwtnews.com`;
                if (platform === 'native' && navigator.share) { try { await navigator.share({ title: news.title, url }); } catch(e){} setShareOpen(false); return; }
                if (platform === 'whatsapp') window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
                if (platform === 'facebook') window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank', 'noopener');
                if (platform === 'twitter')  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
                if (platform === 'telegram') window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(news.title)}`, '_blank', 'noopener');
                if (platform === 'copy') {
                    try { await navigator.clipboard.writeText(url); } catch { const el = document.createElement('textarea'); el.value = url; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); }
                    addNotification({ message: '🔗 Link copied!', type: 'success' });
                }
                setShareOpen(false);
            };

            const isVideo = news.mediaType === 'video' || !!news.videoUrl;

            return (
                <div style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'flex-end',justifyContent:'center'}}
                     onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.72)',backdropFilter:'blur(4px)'}} onClick={onClose}/>
                    <div style={{position:'relative',width:'100%',maxWidth:'800px',maxHeight:'94vh',borderRadius:'22px 22px 0 0',display:'flex',flexDirection:'column',overflow:'hidden',animation:'modalUp 0.28s cubic-bezier(0.25,0.46,0.45,0.94)'}}
                         className="bg-white dark:bg-gray-900">
                        {/* Handle */}
                        <div style={{display:'flex',justifyContent:'center',paddingTop:'10px',flexShrink:0}}>
                            <div style={{width:'36px',height:'4px',borderRadius:'2px'}} className="bg-gray-200 dark:bg-gray-700"/>
                        </div>
                        {/* Header */}
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 16px 10px',flexShrink:0}} className="border-b border-gray-100 dark:border-gray-800">
                            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                                {news.isBreaking && <span style={{background:'#c0392b',color:'white',fontSize:'9px',fontWeight:800,padding:'2px 8px',borderRadius:'4px',textTransform:'uppercase'}}>🚨 BREAKING</span>}
                                <span style={{fontSize:'11px',fontWeight:700,color:'#F5A623',textTransform:'uppercase',letterSpacing:'0.06em'}}>{news.category || 'News'}</span>
                            </div>
                            <button onClick={onClose} style={{width:'30px',height:'30px',borderRadius:'50%',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}
                                    className="bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                        </div>
                        {/* Scrollable body */}
                        <div style={{overflowY:'auto',flex:1}} className="hide-scrollbar">
                            {/* Media */}
                            <div style={{width:'100%',aspectRatio:'16/9',background:'#111',position:'relative',flexShrink:0}}>
                                {isVideo
                                    ? <video src={news.videoUrl || news.imageUrl} poster={news.thumbnail || news.thumbnailUrl || ''} controls style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                                    : <img src={news.imageUrl || 'https://via.placeholder.com/800x450?text=KWT+News'} alt={news.title} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                                }
                                <div style={{position:'absolute',bottom:'10px',left:'10px',background:'rgba(0,0,0,0.58)',backdropFilter:'blur(6px)',borderRadius:'999px',padding:'4px 12px',display:'flex',alignItems:'center',gap:'6px'}}>
                                    {news.sourceLogo && <img src={news.sourceLogo} alt="" style={{width:'14px',height:'14px',borderRadius:'50%'}}/>}
                                    <span style={{color:'white',fontSize:'11px',fontWeight:600}}>{news.source || 'KWT News'}</span>
                                </div>
                            </div>
                            {/* Article */}
                            <div style={{padding:'18px 18px 0'}}>
                                <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'10px',flexWrap:'wrap'}}>
                                    <span style={{fontSize:'12px',color:'#F5A623',fontWeight:600}}><TimeAgo date={news.timestamp}/></span>
                                    {news.readTime && <span style={{fontSize:'11px',color:'#9ca3af'}}>⏱ {news.readTime} min read</span>}
                                    <span style={{fontSize:'11px',color:'#9ca3af'}}>👁 {news.views || 0}</span>
                                    <span style={{fontSize:'11px',color:'#9ca3af'}}>💬 {commentCount}</span>
                                </div>
                                <h1 style={{fontSize:'20px',fontWeight:800,lineHeight:1.35,marginBottom:'14px',letterSpacing:'-0.02em'}} className="text-gray-900 dark:text-white">{news.title}</h1>
                                {news.summary && (
                                    <p style={{fontSize:'14px',lineHeight:1.7,borderLeft:'3px solid #F5A623',paddingLeft:'12px',marginBottom:'16px',fontStyle:'italic'}} className="text-gray-500 dark:text-gray-400">{news.summary}</p>
                                )}
                                {news.content && (
                                    <div style={{fontSize:'15px',lineHeight:1.85,marginBottom:'20px',whiteSpace:'pre-wrap'}} className="text-gray-700 dark:text-gray-300">{news.content}</div>
                                )}
                                {news.tags?.length > 0 && (
                                    <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'16px'}}>
                                        {news.tags.map((tag, i) => (
                                            <span key={i} style={{padding:'3px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:600,background:'rgba(245,166,35,0.1)',color:'#F5A623',border:'1px solid rgba(245,166,35,0.25)'}}>#{tag}</span>
                                        ))}
                                    </div>
                                )}
                            </div>
                            {/* Action bar */}
                            <div style={{display:'flex',alignItems:'center',gap:'4px',padding:'10px 18px'}} className="border-t border-b border-gray-100 dark:border-gray-800">
                                <button onClick={handleLike} style={{display:'flex',alignItems:'center',gap:'6px',padding:'8px 14px',borderRadius:'12px',border:'none',cursor:'pointer',fontSize:'13px',fontWeight:600,transition:'all 0.2s',background:isLiked?'rgba(239,68,68,0.1)':'transparent',color:isLiked?'#ef4444':'#9ca3af'}}
                                        className="hover:bg-red-50 dark:hover:bg-red-900/20">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill={isLiked?"currentColor":"none"} stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                    {likes > 0 && likes}
                                </button>
                                <button onClick={handleSave} style={{display:'flex',alignItems:'center',gap:'6px',padding:'8px 14px',borderRadius:'12px',border:'none',cursor:'pointer',fontSize:'13px',fontWeight:600,transition:'all 0.2s',background:isSaved?'rgba(245,166,35,0.1)':'transparent',color:isSaved?'#F5A623':'#9ca3af'}}
                                        className="hover:bg-amber-50 dark:hover:bg-amber-900/20">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill={isSaved?"currentColor":"none"} stroke="currentColor" strokeWidth="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                                    {isSaved ? 'Saved' : 'Save'}
                                </button>
                                <div style={{position:'relative',marginLeft:'auto'}}>
                                    <button onClick={() => setShareOpen(p => !p)} style={{display:'flex',alignItems:'center',gap:'6px',padding:'8px 14px',borderRadius:'12px',border:'1px solid',cursor:'pointer',fontSize:'13px',fontWeight:600,background:'transparent',color:'#9ca3af'}}
                                            className="border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                                        Share
                                    </button>
                                    {shareOpen && <ShareModal onShare={doShare} onClose={() => setShareOpen(false)} title={news.title}/>}
                                </div>
                                </div>
                            </div>
                            {/* Comments */}
                            <CommentsSection newsId={news.id} onCommentCountChange={setCommentCount}/>
                            <div style={{height:'20px'}}/>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // AD MARQUEE — loads text from Firestore 'ads' collection (position: 'marquee')
        // ==========================================
        const AdMarquee = () => {
            const [items, setItems] = useState([]);
            const fallback = 'Advertise with KWT News · Reach Kuwait & worldwide readers · kwtnews.com@gmail.com';

            useEffect(() => {
                const unsub = db.collection('ads')
                    .where('position', '==', 'marquee')
                    .where('active', '==', true)
                    .limit(10)
                    .onSnapshot(snap => {
                        const texts = snap.docs.map(d => d.data().title || d.data().text || d.data().description).filter(Boolean);
                        setItems(texts.length ? texts : [fallback]);
                    }, () => setItems([fallback]));
                return () => unsub();
            }, []);

            const text = items.join(' · ');
            return (
                <div style={{background:'#fafafa',padding:'5px 0',overflow:'hidden',display:'flex',alignItems:'center',borderBottom:'1px solid #f0f0f0'}} className="dark:bg-gray-900/50 dark:border-gray-800">
                    <span style={{fontSize:'9px',fontWeight:700,color:'#9ca3af',padding:'0 10px',flexShrink:0,whiteSpace:'nowrap',letterSpacing:'0.1em',textTransform:'uppercase',borderRight:'1px solid #e5e7eb'}} className="dark:border-gray-700 dark:text-gray-600">AD</span>
                    <div style={{overflow:'hidden',flex:1}}>
                        <div style={{display:'inline-block',animation:'marqueeScroll 34s linear infinite',whiteSpace:'nowrap',paddingLeft:'16px'}}>
                            <span style={{fontSize:'11px',color:'#9ca3af'}} className="dark:text-gray-500">{text} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; {text}</span>
                        </div>
                    </div>
                </div>
            );
        };

        // Ad Component — real-time, video support, loop, muted by default, unmute button
        const AdBanner = ({ position, className = "" }) => {
            const { t } = useTranslation();
            const [adData, setAdData] = useState(null);
            const [isMuted, setIsMuted] = useState(true);
            const videoRef = useRef(null);

            useEffect(() => {
                // Real-time ad listener with onSnapshot
                const unsub = db.collection('ads')
                    .where('position', '==', position)
                    .limit(10)
                    .onSnapshot(snapshot => {
                        const now = new Date();
                        const valid = snapshot.docs.filter(doc => {
                            const d = doc.data();
                            if (d.active === false && d.status !== 'active') return false;
                            try {
                                const start = d.startDate?.toDate ? d.startDate.toDate() : new Date((d.startDate || '2000-01-01') + 'T00:00:00');
                                const end   = d.endDate?.toDate   ? d.endDate.toDate()   : new Date((d.endDate   || '2099-12-31') + 'T23:59:59');
                                return now >= start && now <= end;
                            } catch(e) { return true; }
                        });
                        if (valid.length > 0) {
                            const adDoc = valid[Math.floor(Math.random() * valid.length)];
                            const data = { id: adDoc.id, ...adDoc.data() };
                            setAdData(prev => prev?.id === data.id ? prev : data);
                            db.collection('ads').doc(adDoc.id).update({ impressions: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
                        } else {
                            setAdData(null);
                        }
                    }, () => {});
                return () => unsub();
            }, [position]);

            const handleAdClick = async (e) => {
                e.stopPropagation();
                if (!adData) return;
                // Track click
                db.collection('ads').doc(adData.id).update({ clicks: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
                // Open target URL
                const url = adData.targetUrl || adData.link || adData.url;
                if (url) {
                    window.open(url, '_blank', 'noopener,noreferrer');
                }
            };

            const toggleMute = (e) => {
                e.stopPropagation();
                e.preventDefault();
                const newMuted = !isMuted;
                setIsMuted(newMuted);
                if (videoRef.current) videoRef.current.muted = newMuted;
            };

            if (!adData) return null;

            const isVideo = adData.mediaType === 'video' || adData.videoUrl || (adData.imageUrl && adData.imageUrl.match(/\.(mp4|webm|ogg)(\?|$)/i));
            const mediaSrc = adData.videoUrl || adData.imageUrl;
            const targetUrl = adData.targetUrl || adData.link || adData.url || '#';

            return (
                <div className={`relative overflow-hidden rounded-xl border border-gray-200 dark:border-gray-700 ${className}`}
                     style={{background:'#f9fafb',maxHeight:'200px',cursor:'pointer'}}
                     onClick={handleAdClick}>
                    {/* Sponsored badge */}
                    <div style={{position:'absolute',top:'6px',left:'6px',zIndex:5,background:'rgba(0,0,0,0.55)',backdropFilter:'blur(4px)',color:'white',fontSize:'9px',fontWeight:700,padding:'2px 7px',borderRadius:'4px',letterSpacing:'0.06em',textTransform:'uppercase',userSelect:'none'}}>
                        {t('sponsored')}

                            <div style={{borderTop:'1px solid rgba(255,255,255,0.06)',paddingTop:'16px',textAlign:'center'}}>

                                <p style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',marginTop:'4px'}}>Domain registered since 2017 &nbsp;·&nbsp; Made with ❤️ in Kuwait</p>
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };
        
        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState(() => {
                try { return localStorage.getItem('kwtActiveTab') || 'all'; } catch(e) { return 'all'; }
            });
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedNews, setSelectedNews] = useState(null);
            const [breakingNews, setBreakingNews] = useState([]);
            const { news, loading, hasMore, loadMore } = useNews(activeTab);
            const { notifications, removeNotification, addNotification } = useNotifications();
            const { t } = useTranslation();
            const [notifPermission, setNotifPermission] = useState(
                typeof Notification !== 'undefined' ? Notification.permission : 'default'
            );
            const [showNotifBanner, setShowNotifBanner] = useState(false);

            // Breaking news real-time
            useEffect(() => {
                const unsub = db.collection('news')
                    .where('isBreaking', '==', true)
                    .orderBy('timestamp', 'desc')
                    .limit(5)
                    .onSnapshot(snap => {
                        setBreakingNews(snap.docs.map(d => ({ id: d.id, ...d.data() }))
                            .filter(n => !n.hidden && (!n.status || n.status === 'active' || n.status === 'Active')));
                    }, () => {});
                return () => unsub();
            }, []);

            // ── Hardware Back Button ──────────────────────────────────────────
            // We push a state entry on every "page" change so Android back
            // button pops it instead of leaving the app.
            const tabHistory = useRef(['all']);

            const navigateTab = useCallback((tabId) => {
                if (tabId === activeTab) return;
                try { localStorage.setItem('kwtActiveTab', tabId); } catch(e) {}
                tabHistory.current.push(tabId);
                // Push a new history entry so popstate fires on back press
                window.history.pushState({ tab: tabId }, '', '');
                setActiveTab(tabId);
            }, [activeTab]);

            useEffect(() => {
                // Push initial entry so first back has something to pop
                window.history.replaceState({ tab: activeTab }, '', '');

                const onPopState = (e) => {
                    // Go one step back in our tab history
                    const hist = tabHistory.current;
                    if (hist.length > 1) {
                        hist.pop();
                        const prev = hist[hist.length - 1];
                        setActiveTab(prev);
                        try { localStorage.setItem('kwtActiveTab', prev); } catch(e) {}
                        // Keep browser history in sync
                        window.history.pushState({ tab: prev }, '', '');
                    }
                    // If only one entry left, let browser handle (exit / go back normally)
                };

                window.addEventListener('popstate', onPopState);
                return () => window.removeEventListener('popstate', onPopState);
            }, []);

            // ── Push Notification Permission ─────────────────────────────────
            useEffect(() => {
                // Show banner after 4 sec if permission not decided yet
                if (typeof Notification === 'undefined') return;
                if (Notification.permission === 'default') {
                    const timer = setTimeout(() => setShowNotifBanner(true), 4000);
                    return () => clearTimeout(timer);
                }
            }, []);

            const requestNotifPermission = async () => {
                setShowNotifBanner(false);
                if (typeof Notification === 'undefined') return;
                try {
                    const permission = await Notification.requestPermission();
                    setNotifPermission(permission);
                    if (permission === 'granted') {
                        try { localStorage.setItem('kwtNotifEnabled', 'true'); } catch(e) {}
                        // Try to get FCM token
                        try {
                            const token = messaging ? await messaging.getToken({
                                vapidKey: 'BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDkBWAVe7axcl0bYFdCvD29NBwkk5K2cGjlj'
                            }) : null;
                            if (token) {
                                await db.collection('fcm_tokens').doc(token).set({
                                    token,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                    platform: 'web'
                                });
                            }
                        } catch (fcmErr) {
                            console.log('FCM token error (non-critical):', fcmErr);
                        }
                        // Show welcome notification
                        new Notification('KWT News 🗞️', {
                            body: 'Notifications enabled! You will receive breaking news alerts.',
                            icon: '/icon-192.png',
                            badge: '/icon-192.png',
                            tag: 'kwt-welcome'
                        });
                        addNotification({ message: '🔔 Notifications enabled!', type: 'success' });
                    } else {
                        try { localStorage.setItem('kwtNotifEnabled', 'false'); } catch(e) {}
                    }
                } catch (err) {
                    console.error('Notification permission error:', err);
                }
            };

            // Listen for new breaking news from Firestore → fire native notification
            useEffect(() => {
                if (notifPermission !== 'granted') return;
                const unsubscribe = db.collection('news')
                    .where('isBreaking', '==', true)
                    .orderBy('timestamp', 'desc')
                    .limit(1)
                    .onSnapshot((snapshot) => {
                        snapshot.docChanges().forEach((change) => {
                            if (change.type === 'added') {
                                const article = change.doc.data();
                                // Only notify if article is fresh (< 2 min old)
                                const age = Date.now() - (article.timestamp?.toMillis?.() || 0);
                                if (age < 120000) {
                                    new Notification('🚨 Breaking News — KWT News', {
                                        body: article.title || 'New breaking news alert',
                                        icon: article.imageUrl || '/icon-192.png',
                                        badge: '/icon-192.png',
                                        tag: 'kwt-breaking-' + change.doc.id,
                                        requireInteraction: true
                                    });
                                }
                            }
                        });
                    });
                return () => unsubscribe();
            }, [notifPermission]);

            // Filter news based on search
            const filteredNews = useMemo(() => {
                if (!searchQuery) return news;
                return news.filter(item => 
                    item.title?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.summary?.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [news, searchQuery]);
            
            // Insert ads every 5th item
            const newsWithAds = useMemo(() => {
                const result = [];
                filteredNews.forEach((item, index) => {
                    if (index > 0 && index % 5 === 0) {
                        result.push({ type: 'ad', id: `ad-${index}` });
                    }
                    result.push({ type: 'news', data: item });
                });
                return result;
            }, [filteredNews]);
            
            const tabs = [
                { id: 'all', label: t('home') },
                { id: 'kuwait', label: t('kuwait') },
                { id: 'world', label: t('world') },
                { id: 'kuwait-jobs', label: '💼 Kuwait Jobs' },
                { id: 'kuwait-offers', label: '🛍️ Kuwait Offers' },
                { id: 'funny-news-meme', label: '😂 Funny & Memes' },
            ];

            return (
                <div className="min-h-screen bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text font-sans transition-colors duration-300">
                    <Header 
                        activeTab={activeTab} 
                        setActiveTab={navigateTab}
                        searchQuery={searchQuery}
                        setSearchQuery={setSearchQuery}
                        onReadMore={setSelectedNews}
                    />
                    
                    {/* 🔔 Notification Permission Banner */}
                    {showNotifBanner && (
                        <div className="bg-gradient-to-r from-primary to-blue-900 text-white px-4 py-3 flex items-center gap-3 shadow-lg">
                            <span className="text-2xl flex-shrink-0">🔔</span>
                            <div className="flex-1 min-w-0">
                                <p className="text-sm font-semibold">Stay updated with Breaking News!</p>
                                <p className="text-xs text-gray-300">Get instant alerts for latest Kuwait & World news.</p>
                            </div>
                            <button
                                onClick={requestNotifPermission}
                                className="flex-shrink-0 bg-accent text-primary text-xs font-bold px-4 py-2 rounded-full hover:bg-yellow-400 transition-colors"
                            >
                                Allow
                            </button>
                            <button
                                onClick={() => setShowNotifBanner(false)}
                                className="flex-shrink-0 p-1.5 hover:bg-white/10 rounded-full transition-colors"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                    )}
                    
                    {/* Ad Strip — from Firestore 'ads' collection with position 'marquee' */}
                    <AdMarquee />

                    {/* Top Banner Ad — Fix 3: 70% size via maxHeight */}
                    <div className="container mx-auto px-4 mt-3" style={{maxWidth:'960px'}}>
                        <AdBanner position="top_banner" style={{maxHeight:'140px'}} />
                    </div>
                    
                    {/* Main Content */}
                    <main className="container mx-auto px-4 py-6">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* News Feed */}
                            <div className="lg:col-span-2 no-copy" style={{display:'flex',flexDirection:'column',gap:'16px'}}>
                                {loading ? (
                                    <>
                                        <NewsCardSkeleton />
                                        <NewsCardSkeleton />
                                        <NewsCardSkeleton />
                                    </>
                                ) : newsWithAds.length === 0 ? (
                                    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'64px 20px',textAlign:'center'}}>
                                        <div style={{fontSize:'64px',marginBottom:'16px',lineHeight:1}}>📭</div>
                                        <h3 style={{fontSize:'18px',fontWeight:700,marginBottom:'8px'}} className="text-light-text dark:text-dark-text">No News Available</h3>
                                        <p style={{fontSize:'14px',color:'#9ca3af',maxWidth:'260px',lineHeight:'1.6'}}>This category has no stories right now. Check back soon!</p>
                                    </div>
                                ) : (
                                    <>
                                        {newsWithAds.map((item, index) => (
                                            item.type === 'ad' ? (
                                                /* Fix 3: in-feed ad 70% size, Fix 2: gap via container margin */
                                                <div key={item.id} style={{maxHeight:'140px',overflow:'hidden',borderRadius:'12px',margin:'4px 0'}}>
                                                    <AdBanner position="in_feed" />
                                                </div>
                                            ) : (
                                                <NewsCard 
                                                    key={item.data.id} 
                                                    news={item.data} 
                                                    index={index}
                                                    onReadMore={setSelectedNews}
                                                />
                                            )
                                        ))}
                                        
                                        {hasMore && (
                                            <button 
                                                onClick={loadMore}
                                                className="w-full py-4 bg-light-card dark:bg-dark-card rounded-xl border border-gray-200 dark:border-gray-700 text-accent font-semibold hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors flex items-center justify-center gap-2"
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
                                                {t('loadMore')}
                                            </button>
                                        )}
                                    </>
                                )}
                            </div>
                            
                            {/* Sidebar */}
                            <div className="hidden lg:block">
                                <div className="sticky top-24">
                                    <Sidebar />
                                </div>
                            </div>
                        </div>
                    </main>
                    
                    <Footer />

                    {/* News Detail Modal */}
                    {selectedNews && (
                        <NewsDetailModal news={selectedNews} onClose={() => setSelectedNews(null)} />
                    )}

                    {/* Breaking News Ticker */}
                    {breakingNews.length > 0 && (
                        <div style={{position:'fixed',bottom:0,left:0,right:0,zIndex:55,background:'#c0392b',color:'white',display:'flex',alignItems:'center',height:'34px',boxShadow:'0 -2px 12px rgba(0,0,0,0.3)'}}>
                            <span style={{flexShrink:0,background:'#a93226',fontWeight:800,fontSize:'10px',letterSpacing:'0.1em',padding:'0 14px',height:'100%',display:'flex',alignItems:'center',textTransform:'uppercase',whiteSpace:'nowrap',borderRight:'2px solid rgba(255,255,255,0.2)'}}>🚨 BREAKING</span>
                            <div style={{overflow:'hidden',flex:1}}>
                                <div style={{display:'inline-block',animation:'marqueeScroll 30s linear infinite',whiteSpace:'nowrap',paddingLeft:'20px'}}>
                                    {[...breakingNews, ...breakingNews].map((n, i) => (
                                        <span key={i} style={{marginRight:'60px',fontSize:'12px',fontWeight:500,cursor:'pointer'}} onClick={() => setSelectedNews(n)}>▶ {n.title}</span>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Toast Notifications */}
                    <div style={{position:'fixed',top:'16px',right:'16px',zIndex:60,display:'flex',flexDirection:'column',gap:'8px',pointerEvents:'none'}}>
                        {notifications.map(notif => (
                            <Toast 
                                key={notif.id}
                                message={notif.message}
                                type={notif.type}
                                onClose={() => removeNotification(notif.id)}
                            />
                        ))}
                    </div>
                </div>
            );
        };
        
        // Root Render
        const Root = () => (
            <ThemeProvider>
                <AuthProvider>
                    <UserDataProvider>
                    <LanguageProvider>
                        <NotificationProvider>
                            <App />
                        </NotificationProvider>
                    </LanguageProvider>
                    </UserDataProvider>
                </AuthProvider>
            </ThemeProvider>
        );
        
        const root = createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
    
    <!-- PWA Install Prompt Only (no data: SW) -->
    <script>
        // PWA Install Prompt
        let deferredPrompt;
        const installPrompt = document.getElementById('install-prompt');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                if (installPrompt) installPrompt.classList.add('show');
            }, 3000);
        });
        
        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                    if (installPrompt) installPrompt.classList.remove('show');
                });
            }
        }
        
        function dismissInstall() {
            if (installPrompt) installPrompt.classList.remove('show');
            deferredPrompt = null;
        }
    </script>
</body>
          </html>
