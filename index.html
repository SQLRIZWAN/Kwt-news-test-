        const ThemeContext = createContext();

        const UserDataContext = createContext({ likedPosts: [], savedPosts: [], likedComments: [] });
        
        // Theme Provider
        const ThemeProvider = ({ children }) => {
            const [isDark, setIsDark] = useState(() => {
                if (typeof window !== 'undefined') {
                    const saved = localStorage.getItem('theme');
                    if (saved) return saved === 'dark';
                    return window.matchMedia?.('(prefers-color-scheme: dark)')?.matches || false;
                }
                return false;
            });
            
            useEffect(() => {
                const root = document.documentElement;
                if (isDark) {
                    root.classList.add('dark');
                    root.style.colorScheme = 'dark';
                    localStorage.setItem('theme', 'dark');
                } else {
                    root.classList.remove('dark');
                    root.style.colorScheme = 'light';
                    localStorage.setItem('theme', 'light');
                }
            }, [isDark]);
            
            const toggleTheme = () => setIsDark(prev => !prev);
            
            return (
                <ThemeContext.Provider value={{ isDark, toggleTheme }}>
                    {children}
                </ThemeContext.Provider>
            );
        };
        
        // Auth Provider
        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                // Auth timeout — don't block UI forever
                const timeout = setTimeout(() => setLoading(false), 5000);
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    clearTimeout(timeout);
                    setUser(user);
                    setLoading(false);
                }, () => {
                    clearTimeout(timeout);
                    setLoading(false);
                });
                return () => { clearTimeout(timeout); unsubscribe(); };
            }, []);
            
            const loginWithGoogle = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    console.error('Google login error:', error);
                }
            };
            
            const loginWithApple = async () => {
                const provider = new firebase.auth.OAuthProvider('apple.com');
                try {

            useEffect(() => {

                    .where('active', '==', true)
                    .orderBy('timestamp', 'desc')

                        snap.docChanges().forEach(change => {
                            if (change.type === 'added') {
                                const data = change.doc.data();
                                const id = change.doc.id;
                                if (!shownIds.current.has(id)) {
                                    shownIds.current.add(id);
                                    const age = Date.now() - (data.timestamp?.toMillis?.() || 0);
                                    if (age < 60000) {
                                        addNotification({ message: data.message || data.title || 'New notification', type: data.type || 'info' });
                                    }
                                }
                            }
                        });
                    }, () => {});
                return () => unsub();

            const addNotification = (notification) => {

                setNotifications(prev => [{ id, ...notification }, ...prev]);
                if (!notification.read) setUnreadCount(prev => prev + 1);
                setTimeout(() => removeNotification(id), 5000);

        const SPECIAL_CATEGORIES = ['kuwait-jobs', 'kuwait-offers', 'funny-news-meme'];

        const useNews = (category = 'all', limit = 20) => {
            const [news, setNews] = useState([]);
            const [loading, setLoading] = useState(true);
            const [hasMore, setHasMore] = useState(true);
            const lastDocRef = useRef(null);
            
            useEffect(() => {
                setLoading(true);
                setNews([]);
                setHasMore(true);
                lastDocRef.current = null;
                
                // Safety timeout — never stuck loading more than 8s
                const timeout = setTimeout(() => setLoading(false), 8000);

                let query;
                
                if (category === 'all') {
                    // Home feed: exclude special categories (client-side filter)
                    query = db.collection('news').orderBy('timestamp', 'desc');
                } else {
                    // Specific category page — show only that category
                    query = db.collection('news')
                        .where('category', '==', category)
                        .orderBy('timestamp', 'desc');
                }
                
                // Fetch more to account for client-side filtering on home feed
                const fetchLimit = category === 'all' ? limit * 3 : limit;
                query = query.limit(fetchLimit);
                
                const unsubscribe = query.onSnapshot((snapshot) => {
                    clearTimeout(timeout);
                    let newsData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        timestamp: doc.data().timestamp?.toDate()
                    })).filter(n => !n.hidden && (!n.status || n.status === 'active' || n.status === 'Active'));
                    // On home feed, exclude special categories entirely
                    if (category === 'all') {
                        newsData = newsData.filter(n => !SPECIAL_CATEGORIES.includes(n.category));
                    }
                    // Store last snapshot doc for cursor-based pagination
                    lastDocRef.current = snapshot.docs[snapshot.docs.length - 1] || null;
                    setNews(newsData);
                    setLoading(false);
                    setHasMore(snapshot.docs.length === fetchLimit);
                }, (error) => {
                    clearTimeout(timeout);
                    console.error('News fetch error:', error);
                    setLoading(false);
                });
                
                return () => { clearTimeout(timeout); unsubscribe(); };
            }, [category, limit]);
            
            const loadMore = async () => {
                if (!lastDocRef.current) return;
                try {
                    let query = db.collection('news').orderBy('timestamp', 'desc');
                    if (category !== 'all') {
                        query = db.collection('news')
                            .where('category', '==', category)
                            .orderBy('timestamp', 'desc');
                    }
                    query = query.startAfter(lastDocRef.current).limit(limit);
                    
                    const snapshot = await query.get();
                    let newNews = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        timestamp: doc.data().timestamp?.toDate()
                    })).filter(n => !n.hidden && (!n.status || n.status === 'active' || n.status === 'Active'));
                    // Filter special categories from home feed
                    if (category === 'all') {
                        newNews = newNews.filter(n => !SPECIAL_CATEGORIES.includes(n.category));
                    }
                    
                    lastDocRef.current = snapshot.docs[snapshot.docs.length - 1] || lastDocRef.current;
                    setNews(prev => [...prev, ...newNews]);
                    setHasMore(snapshot.docs.length === limit);
                } catch (err) {
                    console.error('Load more error:', err);
                }
            };
            
            return { news, loading, hasMore, loadMore };

        // Time Ago Component
        const TimeAgo = ({ date }) => {
            const { t } = useTranslation();
            
            const getTimeAgo = (date) => {
                if (!date) return '';
                const seconds = Math.floor((new Date() - date) / 1000);
                if (seconds < 5) return t('justNow');
                let interval = seconds / 31536000;
                if (interval > 1) return Math.floor(interval) + 'y ' + t('ago');
                interval = seconds / 2592000;
                if (interval > 1) return Math.floor(interval) + 'mo ' + t('ago');
                interval = seconds / 86400;
                if (interval > 1) return Math.floor(interval) + ' ' + t('days') + ' ' + t('ago');
                interval = seconds / 3600;
                if (interval > 1) return Math.floor(interval) + ' ' + t('hours') + ' ' + t('ago');
                interval = seconds / 60;
                if (interval > 1) return Math.floor(interval) + ' ' + t('minutes') + ' ' + t('ago');
                return t('justNow');
            };
            
            return <span>{getTimeAgo(date)}</span>;

        // ==========================================
        // SEARCH MODAL — live Firestore keyword search
        // ==========================================
        const SearchModal = ({ onClose, onReadMore }) => {
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [loading, setLoading] = useState(false);
            const [searched, setSearched] = useState(false);
            const inputRef = useRef(null);
            const debounceRef = useRef(null);

            useEffect(() => {
                inputRef.current?.focus();
                const onKey = e => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                document.body.style.overflow = 'hidden';
                return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
            }, []);

            useEffect(() => {
                clearTimeout(debounceRef.current);
                const q = query.trim();
                if (!q || q.length < 2) { setResults([]); setSearched(false); setLoading(false); return; }
                setLoading(true);
                debounceRef.current = setTimeout(async () => {
                    try {
                        // Firestore range query on title (starts-with keyword)
                        const qLower = q.toLowerCase();
                        const snap = await db.collection('news')
                            .orderBy('title')
                            .startAt(q)
                            .endAt(q + '\uf8ff')
                            .limit(15)
                            .get();
                        const snap2 = await db.collection('news')
                            .orderBy('title')
                            .startAt(q.charAt(0).toUpperCase() + q.slice(1))
                            .endAt(q.charAt(0).toUpperCase() + q.slice(1) + '\uf8ff')
                            .limit(10)
                            .get();
                        // Merge and client-filter for broader match
                        const all = [...snap.docs, ...snap2.docs];
                        const seen = new Set();
                        const items = [];
                        all.forEach(doc => {
                            if (seen.has(doc.id)) return; seen.add(doc.id);
                            const d = doc.data();
                            const matchTitle = d.title?.toLowerCase().includes(qLower);
                            const matchSummary = d.summary?.toLowerCase().includes(qLower);
                            const matchContent = d.content?.toLowerCase().includes(qLower);
                            if (matchTitle || matchSummary || matchContent) {
                                items.push({ id: doc.id, ...d, timestamp: d.timestamp?.toDate() });
                            }
                        });
                        // Also do a broad client-side filter from recent 100 docs if few results
                        if (items.length < 5) {
                            const broadSnap = await db.collection('news').orderBy('timestamp','desc').limit(100).get();
                            broadSnap.docs.forEach(doc => {
                                if (seen.has(doc.id)) return;
                                const d = doc.data();
                                if ((d.title||'').toLowerCase().includes(qLower) ||
                                    (d.summary||'').toLowerCase().includes(qLower)) {
                                    seen.add(doc.id);
                                    items.push({ id: doc.id, ...d, timestamp: d.timestamp?.toDate() });
                                }
                            });
                        }
                        setResults(items.slice(0, 20));
                        setSearched(true);
                    } catch(e) { console.error(e); setResults([]); setSearched(true); }
                    setLoading(false);
                }, 400);
            }, [query]);

            const highlight = (text, q) => {
                if (!text || !q) return text;
                const idx = text.toLowerCase().indexOf(q.toLowerCase());
                if (idx < 0) return text.substring(0, 80);
                const start = Math.max(0, idx - 20);
                const end = Math.min(text.length, idx + q.length + 60);
                return (
                    <>
                        {start > 0 && '...'}
                        {text.substring(start, idx)}
                        <mark style={{background:'rgba(245,166,35,0.3)',color:'inherit',borderRadius:'2px',padding:'0 1px'}}>{text.substring(idx, idx + q.length)}</mark>
                        {text.substring(idx + q.length, end)}
                        {end < text.length && '...'}
                    </>
                );
            };

            return (
                <>
                <div style={{position:'fixed',inset:0,zIndex:190,background:'rgba(0,0,0,0.55)',backdropFilter:'blur(4px)'}} onClick={onClose}/>
                <div style={{position:'fixed',top:'60px',left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:'600px',padding:'0 12px',zIndex:195,maxHeight:'80vh',display:'flex',flexDirection:'column'}}>
                    <div style={{background:'#0f1f3d',borderRadius:'18px',boxShadow:'0 24px 72px rgba(0,0,0,0.6)',border:'1px solid rgba(255,255,255,0.12)',overflow:'hidden',display:'flex',flexDirection:'column',maxHeight:'inherit'}}>
                        {/* Input row */}
                        <div style={{display:'flex',alignItems:'center',padding:'14px 16px',gap:'12px',borderBottom:'1px solid rgba(255,255,255,0.07)',flexShrink:0}}>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={loading?'#F5A623':'rgba(255,255,255,0.4)'} strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input ref={inputRef} autoFocus type="text" placeholder="Search news, keywords..."
                                value={query} onChange={e => setQuery(e.target.value)}
                                onKeyDown={e => { if (e.key === 'Escape') onClose(); }}
                                style={{background:'transparent',border:'none',outline:'none',color:'white',fontSize:'15px',width:'100%',fontFamily:'inherit'}}/>
                            {query ? (
                                <button onClick={() => { setQuery(''); setResults([]); setSearched(false); }}
                                    style={{color:'rgba(255,255,255,0.5)',background:'rgba(255,255,255,0.1)',border:'none',cursor:'pointer',display:'flex',padding:'5px',borderRadius:'50%'}}>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                </button>
                            ) : (
                                <button onClick={onClose} style={{color:'rgba(255,255,255,0.35)',background:'rgba(255,255,255,0.08)',border:'none',cursor:'pointer',padding:'3px 8px',borderRadius:'6px',fontSize:'10px',fontWeight:600,letterSpacing:'0.05em',flexShrink:0}}>ESC</button>
                            )}
                        </div>

                        {/* Results area */}
                        <div style={{overflowY:'auto',flex:1}} className="hide-scrollbar">
                            {loading && (
                                <div style={{display:'flex',justifyContent:'center',alignItems:'center',padding:'24px',gap:'10px',color:'rgba(255,255,255,0.5)',fontSize:'13px'}}>
                                    <div style={{width:'16px',height:'16px',border:'2px solid #F5A623',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/>
                                    Searching...
                                </div>
                            )}
                            {!loading && searched && results.length === 0 && (
                                <div style={{textAlign:'center',padding:'32px 20px',color:'rgba(255,255,255,0.35)'}}>
                                    <div style={{fontSize:'32px',marginBottom:'8px'}}>🔍</div>
                                    <p style={{fontSize:'14px',fontWeight:600}}>No results for "{query}"</p>
                                    <p style={{fontSize:'12px',marginTop:'4px',opacity:0.6}}>Try different keywords</p>
                                </div>
                            )}
                            {!loading && results.length > 0 && (
                                <div style={{padding:'8px 0'}}>
                                    <p style={{fontSize:'10px',color:'rgba(255,255,255,0.35)',padding:'4px 16px 8px',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em'}}>
                                        {results.length} result{results.length !== 1 ? 's' : ''} for "{query}"
                                    </p>
                                    {results.map(item => (
                                        <button key={item.id}
                                            onClick={() => { onReadMore && onReadMore(item); onClose(); }}
                                            style={{width:'100%',display:'flex',gap:'12px',padding:'10px 16px',background:'transparent',border:'none',cursor:'pointer',textAlign:'left',transition:'background 0.15s'}}
                                            className="hover:bg-white/5">
                                            <img src={item.imageUrl||'https://via.placeholder.com/60x45?text=KWT'} alt=""
                                                 style={{width:'64px',height:'46px',objectFit:'cover',borderRadius:'8px',flexShrink:0,border:'1px solid rgba(255,255,255,0.1)'}}
                                                 onError={e => e.target.style.display='none'}/>
                                            <div style={{flex:1,minWidth:0}}>
                                                <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'3px'}}>
                                                    {item.isBreaking && <span style={{fontSize:'8px',fontWeight:800,color:'white',background:'#c0392b',padding:'1px 5px',borderRadius:'3px',textTransform:'uppercase'}}>BREAKING</span>}
                                                    <span style={{fontSize:'9px',fontWeight:700,color:'#F5A623',textTransform:'uppercase'}}>{item.category||'News'}</span>
                                                </div>
                                                <p style={{fontSize:'13px',fontWeight:600,color:'white',lineHeight:1.35,marginBottom:'3px',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>
                                                    {highlight(item.title, query)}
                                                </p>
                                                {item.summary && (
                                                    <p style={{fontSize:'11px',color:'rgba(255,255,255,0.45)',lineHeight:1.4,display:'-webkit-box',WebkitLineClamp:1,WebkitBoxOrient:'vertical',overflow:'hidden'}}>
                                                        {highlight(item.summary, query)}
                                                    </p>
                                                )}
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            )}
                            {!loading && !searched && (
                                <div style={{padding:'16px 16px 12px'}}>
                                    <p style={{color:'rgba(255,255,255,0.25)',fontSize:'12px',marginBottom:'10px'}}>Popular searches</p>
                                    {['Kuwait News','Breaking','World','Economy','Sports'].map(tag => (
                                        <button key={tag} onClick={() => setQuery(tag)}
                                            style={{display:'inline-block',margin:'3px',padding:'5px 12px',borderRadius:'999px',background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.1)',color:'rgba(255,255,255,0.6)',fontSize:'12px',cursor:'pointer',fontWeight:500}}>
                                            {tag}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
                </>
            );
        };

        // ==========================================
        // HEADER COMPONENT
        // ==========================================

            const [showLangMenu, setShowLangMenu] = useState(false);

            const [showLikedModal, setShowLikedModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            // notifEnabled: sync with actual browser permission so it never auto-resets
            const [notifEnabled, setNotifEnabled] = useState(() => {
                if (typeof Notification === 'undefined') return false;
                if (Notification.permission === 'granted') return true;
                try { return localStorage.getItem('kwtNotifEnabled') === 'true'; } catch(e) { return false; }
            });

            // Keep notifEnabled in sync if permission changes externally
            useEffect(() => {
                if (typeof Notification === 'undefined') return;
                if (Notification.permission === 'granted') {
                    setNotifEnabled(true);
                    try { localStorage.setItem('kwtNotifEnabled', 'true'); } catch(e) {}
                } else if (Notification.permission === 'denied') {
                    setNotifEnabled(false);
                    try { localStorage.setItem('kwtNotifEnabled', 'false'); } catch(e) {}
                }
            }, []);

            const handleNotifToggle = async () => {
                if (typeof Notification === 'undefined') return;
                if (notifEnabled) {
                    // Turn off
                    setNotifEnabled(false);
                    try { localStorage.setItem('kwtNotifEnabled', 'false'); } catch(e) {}
                    return;
                }
                // Turn on: request permission
                try {
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        setNotifEnabled(true);
                        try { localStorage.setItem('kwtNotifEnabled', 'true'); } catch(e) {}
                        new Notification('KWT News 🗞️', {
                            body: 'Breaking news alerts enabled!',
                            icon: '/icon-192.png',
                            tag: 'kwt-welcome'
                        });
                    } else {
                        setNotifEnabled(false);
                        try { localStorage.setItem('kwtNotifEnabled', 'false'); } catch(e) {}
                    }
                } catch(err) {
                    console.error('Notification toggle error:', err);
                }
            };
            
            const languages = [
                { code: 'en', name: 'English', flag: '🇺🇸' },

            const tabs = [

                { id: 'world', label: t('world'), icon: '🌍' },
                { id: 'kuwait-jobs', label: 'Kuwait Jobs', icon: '💼' },
                { id: 'kuwait-offers', label: 'Kuwait Offers', icon: '🛍️' },
                { id: 'funny-news-meme', label: 'Funny & Memes', icon: '😂' },
            ];

            const trendingTopics = ['#KuwaitWeather', '#GoldPrice', '#FootballNews', '#BreakingKWT', '#WorldNews'];
            
            return (
                <>
                {/* ── SIDEBAR DRAWER OVERLAY ── */}
                {drawerOpen && (
                    <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',justifyContent:'flex-end'}}>

                        {/* Drawer Panel — RIGHT side */}

                            {/* Drawer Header - Profile / Login */}
                            <div style={{background:'linear-gradient(135deg,#0d1e3a 0%,#162a4a 100%)',padding:'20px 16px 16px',flexShrink:0}}>
                                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
                                    <Logo />
                                    <button onClick={() => setDrawerOpen(false)} style={{padding:'6px',borderRadius:'50%',background:'rgba(255,255,255,0.1)',border:'none',cursor:'pointer',color:'white',display:'flex',alignItems:'center',justifyContent:'center'}} className="hover:bg-white/20">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                    </button>
                                </div>
                                {user ? (

                                        <img src={user.photoURL || ('https://ui-avatars.com/api/?name='+encodeURIComponent(user.displayName||'U')+'&background=F5A623&color=0A1628')} style={{width:'44px',height:'44px',borderRadius:'50%',border:'2px solid #F5A623',flexShrink:0}} alt="avatar"/>
                                        <div style={{minWidth:0,flex:1}}>
                                            <p style={{fontWeight:700,fontSize:'14px',color:'white',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.displayName || 'User'}</p>

                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Google
                        </button>
                        <button
                            onClick={() => { loginWithApple(); onClose(); }}
                            className="flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-sm font-medium"
                        >
                            <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                            </svg>
                            Apple
                        </button>
                    </div>
                </div>
            );
        };
        
        // ==========================================
        // SHARE MODAL — native-style bottom sheet
        // ==========================================
        const ShareModal = ({ onShare, onClose, title }) => {
            const hasNative = !!navigator.share;
            const options = [
                ...(hasNative ? [{ id:'native', icon:'📤', label:'Share via...', color:'#0A1628' }] : []),
                { id:'whatsapp', icon:'📱', label:'WhatsApp', color:'#25D366' },
                { id:'facebook', icon:'📘', label:'Facebook', color:'#1877F2' },
                { id:'twitter', icon:'🐦', label:'X (Twitter)', color:'#000000' },
                { id:'telegram', icon:'✈️', label:'Telegram', color:'#2AABEE' },
                { id:'copy', icon:'🔗', label:'Copy Link', color:'#6b7280' },

            return (
                <>
                <div style={{position:'fixed',inset:0,zIndex:390,background:'rgba(0,0,0,0.45)',backdropFilter:'blur(3px)'}} onClick={onClose}/>
                <div style={{position:'fixed',bottom:0,left:0,right:0,zIndex:400,borderRadius:'20px 20px 0 0',animation:'modalUp 0.25s ease-out',maxWidth:'520px',margin:'0 auto'}}
                     className="bg-white dark:bg-gray-900">
                    {/* Handle bar */}
                    <div style={{display:'flex',justifyContent:'center',padding:'10px 0 4px'}}>

                    </div>
                    <div style={{padding:'6px 16px 14px'}}>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
                            <div>
                                <p style={{fontWeight:700,fontSize:'16px'}} className="text-gray-900 dark:text-white">Share Article</p>
                                {title && <p style={{fontSize:'12px',color:'#9ca3af',marginTop:'2px',display:'-webkit-box',WebkitLineClamp:1,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{title}</p>}
                            </div>
                            <button onClick={onClose} style={{width:'32px',height:'32px',borderRadius:'50%',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',background:'#f3f4f6',flexShrink:0}} className="dark:bg-gray-800 dark:text-gray-300">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>

                        {/* Share options grid */}
                        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'10px',marginBottom:'12px'}}>

                                    style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',padding:'14px 8px',borderRadius:'14px',border:'1px solid',cursor:'pointer',background:'transparent',transition:'all 0.15s'}}
                                    className="border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800">
                                    <span style={{fontSize:'24px'}}>{opt.icon}</span>
                                    <span style={{fontSize:'11px',fontWeight:600,color:'#374151'}} className="dark:text-gray-300">{opt.label}</span>
                                </button>
                            ))}
                        </div>
                        <p style={{fontSize:'10px',color:'#9ca3af',textAlign:'center',paddingBottom:'4px'}}>kwtnews.com</p>
                    </div>
                </div>
                </>
            );
        };

        // ==========================================
        // COMMENT MODAL — Premium chat-style UI
        // ==========================================
        const CommentModal = ({ news, onClose }) => {
            const { t } = useTranslation();
            const { user } = useAuth();
            const { addNotification } = useNotifications();
            const userData = useContext(UserDataContext);
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState('');
            const [loading, setLoading] = useState(true);
            const [replyTo, setReplyTo] = useState(null);
            const [commentCount, setCommentCount] = useState(news.commentCount || 0);
            const bottomRef = useRef(null);
            const inputRef = useRef(null);

            useEffect(() => {
                const onKey = e => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                document.body.style.overflow = 'hidden';
                return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
            }, []);

            useEffect(() => {
                const unsub = db.collection('comments')
                    .where('newsId', '==', news.id)
                    .orderBy('timestamp', 'asc')
                    .onSnapshot(snap => {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data(), timestamp: d.data().timestamp?.toDate() }));
                        setComments(data);
                        setCommentCount(data.length);
                        setLoading(false);
                    }, () => setLoading(false));
                return () => unsub();
            }, [news.id]);

            const handleSubmit = async e => {
                e && e.preventDefault();
                const text = newComment.trim();
                if (!text || !user) return;
                const content = replyTo ? `@${replyTo.name} ${text}` : text;
                setNewComment('');
                setReplyTo(null);
                try {
                    await db.collection('comments').add({
                        newsId: news.id, content,
                        authorId: user.uid, authorName: user.displayName || 'Anonymous',
                        authorPhoto: user.photoURL || null,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        likes: 0,
                    });
                    await db.collection('news').doc(news.id).update({ commentCount: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
                    setTimeout(() => bottomRef.current?.scrollIntoView({ behavior:'smooth' }), 200);
                } catch(err) { console.error(err); }
            };

            const handleCommentLike = async comment => {
                if (!user) { addNotification({ message: '🔐 Login to like', type:'info' }); return; }
                const liked = userData.likedComments.includes(comment.id);
                await db.collection('comments').doc(comment.id).update({ likes: firebase.firestore.FieldValue.increment(liked ? -1 : 1) }).catch(()=>{});
                const ur = db.collection('users').doc(user.uid);
                if (liked) await ur.update({ likedComments: firebase.firestore.FieldValue.arrayRemove(comment.id) }).catch(()=>{});
                else await ur.update({ likedComments: firebase.firestore.FieldValue.arrayUnion(comment.id) }).catch(()=>{});
            };

            const handleDelete = async (cid, authorId) => {
                if (user?.uid !== authorId) return;
                if (!window.confirm('Delete this comment?')) return;
                await db.collection('comments').doc(cid).delete().catch(()=>{});
                await db.collection('news').doc(news.id).update({ commentCount: firebase.firestore.FieldValue.increment(-1) }).catch(()=>{});
            };

            return (
                <div style={{position:'fixed',inset:0,zIndex:350,display:'flex',flexDirection:'column'}} className="bg-white dark:bg-gray-900">
                    {/* Header with blurred news */}
                    <div style={{position:'relative',overflow:'hidden',flexShrink:0,height:'130px'}}>
                        <img src={news.imageUrl||'https://via.placeholder.com/800x200?text=KWT+News'} alt=""
                             style={{width:'100%',height:'100%',objectFit:'cover',filter:'blur(4px) brightness(0.35)',transform:'scale(1.08)'}}/>
                        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',padding:'0 16px',gap:'12px'}}>
                            <button onClick={onClose}
                                style={{width:'34px',height:'34px',borderRadius:'50%',background:'rgba(255,255,255,0.15)',border:'none',cursor:'pointer',color:'white',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,backdropFilter:'blur(4px)'}}>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                            </button>
                            <div style={{flex:1,minWidth:0}}>
                                <span style={{fontSize:'10px',fontWeight:700,color:'#F5A623',textTransform:'uppercase',letterSpacing:'0.08em',display:'block',marginBottom:'3px'}}>{news.category||'News'}</span>
                                <h3 style={{fontSize:'14px',fontWeight:700,color:'white',lineHeight:1.3,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{news.title}</h3>
                            </div>
                            <div style={{flexShrink:0,background:'rgba(255,255,255,0.1)',borderRadius:'10px',padding:'6px 10px',textAlign:'center',backdropFilter:'blur(4px)'}}>
                                <span style={{fontSize:'16px',fontWeight:800,color:'white',display:'block'}}>{commentCount}</span>
                                <span style={{fontSize:'9px',color:'rgba(255,255,255,0.7)',textTransform:'uppercase'}}>Comments</span>
                            </div>
                        </div>
                    </div>

                    {/* Comments list */}
                    <div style={{flex:1,overflowY:'auto',padding:'12px 12px 0'}} className="hide-scrollbar">
                        {loading ? (
                            <div style={{display:'flex',justifyContent:'center',padding:'32px',color:'#9ca3af'}}>
                                <div style={{width:'24px',height:'24px',border:'2px solid #F5A623',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
                            </div>
                        ) : comments.length === 0 ? (
                            <div style={{textAlign:'center',padding:'48px 20px',color:'#9ca3af'}}>
                                <div style={{fontSize:'40px',marginBottom:'10px'}}>💬</div>
                                <p style={{fontWeight:700,fontSize:'14px',marginBottom:'4px'}} className="text-gray-700 dark:text-gray-300">No comments yet</p>
                                <p style={{fontSize:'12px'}}>Be the first to share your thoughts!</p>
                            </div>
                        ) : comments.map(comment => {
                            const liked = userData.likedComments.includes(comment.id);
                            const isOwn = user?.uid === comment.authorId;
                            const isMine = isOwn;
                            return (
                                <div key={comment.id} style={{display:'flex',gap:'8px',marginBottom:'12px',flexDirection: isMine ? 'row-reverse' : 'row'}}>
                                    <img src={comment.authorPhoto||`https://ui-avatars.com/api/?name=${encodeURIComponent(comment.authorName||'U')}&background=F5A623&color=0A1628&size=64`}
                                         alt="" style={{width:'32px',height:'32px',borderRadius:'50%',objectFit:'cover',flexShrink:0,border:'2px solid',borderColor: isMine ? '#F5A623' : 'rgba(245,166,35,0.2)',alignSelf:'flex-end'}}/>
                                    <div style={{maxWidth:'72%'}}>
                                        {!isMine && <span style={{fontSize:'11px',fontWeight:700,color:'#F5A623',marginBottom:'3px',display:'block'}}>{comment.authorName}</span>}
                                        <div style={{padding:'10px 13px',borderRadius: isMine ? '16px 4px 16px 16px' : '4px 16px 16px 16px',
                                            background: isMine ? '#F5A623' : '#f3f4f6',
                                            color: isMine ? '#0A1628' : '#1f2937'}}
                                             className={!isMine ? 'dark:bg-gray-800 dark:text-gray-100' : ''}>
                                            <p style={{fontSize:'13px',lineHeight:1.55,wordBreak:'break-word'}} className="comment-content">{comment.content}</p>
                                        </div>
                                        <div style={{display:'flex',alignItems:'center',gap:'8px',marginTop:'4px',justifyContent: isMine ? 'flex-end' : 'flex-start'}}>
                                            <span style={{fontSize:'10px',color:'#9ca3af'}}><TimeAgo date={comment.timestamp}/></span>
                                            <button onClick={() => handleCommentLike(comment)}
                                                style={{display:'flex',alignItems:'center',gap:'3px',fontSize:'11px',background:'none',border:'none',cursor:'pointer',color: liked ? '#ef4444' : '#9ca3af',fontWeight:600,padding:'1px 4px'}}>
                                                <svg width="11" height="11" viewBox="0 0 24 24" fill={liked?"currentColor":"none"} stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                                {comment.likes > 0 && comment.likes}
                                            </button>
                                            <button onClick={() => { setReplyTo({ id: comment.id, name: comment.authorName }); inputRef.current?.focus(); }}
                                                style={{fontSize:'11px',background:'none',border:'none',cursor:'pointer',color:'#9ca3af',fontWeight:600}}>↩ Reply</button>
                                            {isOwn && <button onClick={() => handleDelete(comment.id, comment.authorId)}
                                                style={{fontSize:'11px',background:'none',border:'none',cursor:'pointer',color:'#9ca3af'}}>🗑</button>}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        <div ref={bottomRef}/>
                    </div>

                    {/* Input area */}
                    <div style={{borderTop:'1px solid',padding:'10px 12px',flexShrink:0,background:'inherit'}} className="border-gray-100 dark:border-gray-800">
                        {replyTo && (
                            <div style={{display:'flex',alignItems:'center',gap:'8px',padding:'5px 10px',borderRadius:'8px',marginBottom:'6px',fontSize:'12px',color:'#F5A623',background:'rgba(245,166,35,0.08)',border:'1px solid rgba(245,166,35,0.2)'}}>
                                ↩ Replying to <strong style={{marginLeft:'3px'}}>@{replyTo.name}</strong>
                                <button onClick={() => setReplyTo(null)} style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'#9ca3af',fontSize:'16px',lineHeight:1,padding:0}}>×</button>
                            </div>
                        )}
                        {user ? (
                            <div style={{display:'flex',gap:'8px',alignItems:'flex-end'}}>
                                <img src={user.photoURL||`https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName||'U')}&background=F5A623&color=0A1628&size=64`}
                                     alt="" style={{width:'32px',height:'32px',borderRadius:'50%',objectFit:'cover',flexShrink:0,border:'2px solid #F5A623'}}/>
                                <div style={{flex:1,display:'flex',alignItems:'flex-end',gap:'8px',background:'#f3f4f6',borderRadius:'20px',padding:'8px 12px'}} className="dark:bg-gray-800">
                                    <textarea ref={inputRef} value={newComment} onChange={e => setNewComment(e.target.value)}
                                        onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSubmit(); } }}
                                        placeholder={replyTo ? `Reply to @${replyTo.name}...` : 'Write a comment...'}
                                        rows="1" style={{flex:1,background:'transparent',border:'none',outline:'none',fontSize:'13px',resize:'none',lineHeight:1.5,maxHeight:'80px',overflow:'auto',fontFamily:'inherit'}}
                                        className="text-gray-900 dark:text-gray-100 placeholder-gray-400"/>
                                    <button onClick={handleSubmit} disabled={!newComment.trim()}
                                        style={{flexShrink:0,width:'30px',height:'30px',borderRadius:'50%',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',background: newComment.trim() ? '#F5A623' : '#d1d5db',transition:'background 0.2s'}}>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={newComment.trim() ? '#0A1628' : '#9ca3af'} strokeWidth="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div style={{textAlign:'center',padding:'12px',borderRadius:'12px',fontSize:'13px',color:'#9ca3af',border:'1.5px dashed'}} className="border-gray-200 dark:border-gray-700">
                                🔐 Login to comment
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // News Card Component
        const NewsCard = ({ news, index, onReadMore }) => {
            const { t } = useTranslation();
            const { user } = useAuth();
            const { addNotification } = useNotifications();
            const userData = useContext(UserDataContext);
            const isLiked = userData.likedPosts.includes(news.id);
            const isSaved = userData.savedPosts.includes(news.id);
            const [showCommentModal, setShowCommentModal] = useState(false);
            const [shareOpen, setShareOpen] = useState(false);
            const [likes, setLikes] = useState(news.likes || 0);
            const [commentCount, setCommentCount] = useState(news.commentCount || 0);
            const [imgError, setImgError] = useState(false);

            // Real-time comment count
            useEffect(() => {
                const unsub = db.collection('news').doc(news.id).onSnapshot(snap => {
                    if (snap.exists) {
                        const d = snap.data();
                        setLikes(d.likes || 0);
                        setCommentCount(d.commentCount || 0);
                    }
                }, () => {});
                return () => unsub();
            }, [news.id]);

            // Increment views once
            useEffect(() => {
                const t = setTimeout(() => {
                    db.collection('news').doc(news.id).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
                }, 3000);
                return () => clearTimeout(t);
            }, [news.id]);

            const handleLike = async () => {
                if (!user) { addNotification({ message: '🔐 Login to like', type: 'info' }); return; }
                const nr = db.collection('news').doc(news.id);
                const ur = db.collection('users').doc(user.uid);
                if (isLiked) {
                    await nr.update({ likes: firebase.firestore.FieldValue.increment(-1) }).catch(()=>{});
                    await ur.update({ likedPosts: firebase.firestore.FieldValue.arrayRemove(news.id) }).catch(()=>{});
                } else {
                    await nr.update({ likes: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
                    await ur.update({ likedPosts: firebase.firestore.FieldValue.arrayUnion(news.id) }).catch(()=>{});
                }
            };

            const handleSave = async () => {
                if (!user) { addNotification({ message: '🔐 Login to save', type: 'info' }); return; }
                const ur = db.collection('users').doc(user.uid);
                if (isSaved) {
                    await ur.update({ savedPosts: firebase.firestore.FieldValue.arrayRemove(news.id) }).catch(()=>{});
                    addNotification({ message: 'Removed from saved', type: 'success' });
                } else {
                    await ur.update({ savedPosts: firebase.firestore.FieldValue.arrayUnion(news.id) }).catch(()=>{});
                    addNotification({ message: '✅ Saved!', type: 'success' });
                }
            };

            const handleShare = async (platform) => {
                const url = `https://kwtnews.com/news/${news.id}`;
                const text = `📰 ${news.title}\n\n${news.summary?.substring(0,100) || ''}...\n\n🔗 ${url}\nVia KWT News - kwtnews.com`;
                if (platform === 'native' && navigator.share) {
                    try { await navigator.share({ title: news.title, text: news.summary || '', url }); } catch(e) {}
                    setShareOpen(false); return;
                }
                if (platform === 'whatsapp') window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
                if (platform === 'facebook') window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank', 'noopener');
                if (platform === 'twitter') window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
                if (platform === 'telegram') window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(news.title)}`, '_blank', 'noopener');
                if (platform === 'copy') {
                    try { await navigator.clipboard.writeText(url); } catch { const el=document.createElement('textarea'); el.value=url; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); }
                    addNotification({ message: '🔗 Link copied!', type: 'success' });
                }
                setShareOpen(false);
            };

            const isVideo = news.mediaType === 'video' || news.videoUrl || (news.imageUrl && /\.(mp4|webm|ogg)/i.test(news.imageUrl));
            const mediaSrc = news.imageUrl || 'https://via.placeholder.com/800x450?text=KWT+News';

            return (
                <article style={{background:'var(--card-bg,#fff)',borderRadius:'16px',overflow:'hidden',border:'1px solid rgba(0,0,0,0.07)',marginBottom:'16px',boxShadow:'0 1px 6px rgba(0,0,0,0.07)',transition:'box-shadow 0.2s'}}
                    className="dark:bg-dark-card dark:border-gray-700/50 hover:shadow-lg">
                    {/* Media */}
                    <div style={{position:'relative',width:'100%',aspectRatio:'16/9',background:'#e5e7eb',overflow:'hidden',cursor:'pointer'}}
                         onClick={() => onReadMore && onReadMore(news)}>
                        {isVideo ? (
                            <video src={news.videoUrl || news.imageUrl} poster={news.thumbnail} preload="none"
                                style={{width:'100%',height:'100%',objectFit:'cover'}} playsInline/>
                        ) : imgError ? (
                            <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0A1628,#1a2744)'}}>
                                <span style={{fontSize:'40px'}}>📰</span>
                            </div>
                        ) : (
                            <img src={mediaSrc} alt={news.title}
                                style={{width:'100%',height:'100%',objectFit:'cover',transition:'transform 0.4s'}}
                                loading="lazy" decoding="async"
                                onError={() => setImgError(true)}
                                onMouseOver={e=>e.currentTarget.style.transform='scale(1.04)'}
                                onMouseOut={e=>e.currentTarget.style.transform='scale(1)'}/>
                        )}
                        {/* Category badge */}
                        {news.category && (
                            <div style={{position:'absolute',top:'10px',left:'10px',background:'#F5A623',color:'#0A1628',fontSize:'9px',fontWeight:800,padding:'3px 8px',borderRadius:'4px',textTransform:'uppercase',letterSpacing:'0.07em'}}>{news.category}</div>
                        )}
                        {news.isBreaking && (

                        )}
                        {/* Views */}

                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            {news.views >= 1000 ? (news.views/1000).toFixed(1)+'K' : (news.views||0)}
                        </div>
                        {/* Source */}
                        {news.source && (
                            <div style={{position:'absolute',bottom:'8px',left:'8px',background:'rgba(0,0,0,0.55)',backdropFilter:'blur(6px)',color:'white',fontSize:'10px',fontWeight:600,padding:'2px 8px',borderRadius:'99px'}}>

                            </div>

                    {/* Content */}
                    <div style={{padding:'14px 16px 12px'}}>

                        </div>
                        <h2 onClick={() => onReadMore && onReadMore(news)}
                            style={{fontSize:'16px',fontWeight:700,lineHeight:1.45,marginBottom:'8px',cursor:'pointer',letterSpacing:'-0.01em',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}
                            className="text-gray-900 dark:text-white hover:text-accent transition-colors">
                            {news.title}
                        </h2>
                        <p style={{fontSize:'13px',lineHeight:1.6,marginBottom:'12px',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}
                           className="text-gray-500 dark:text-gray-400">
                            {news.summary || news.content?.substring(0, 120) || ''}
                        </p>

                        {/* Action Bar */}
                        <div style={{display:'flex',alignItems:'center',gap:'2px',paddingTop:'10px',borderTop:'1px solid'}} className="border-gray-100 dark:border-gray-700/60">
                            {/* Like */}
                            <button onClick={handleLike}
                                style={{display:'flex',alignItems:'center',gap:'5px',padding:'6px 10px',borderRadius:'10px',border:'none',cursor:'pointer',fontSize:'12px',fontWeight:600,transition:'all 0.15s',
                                    background: isLiked ? 'rgba(239,68,68,0.1)' : 'transparent',
                                    color: isLiked ? '#ef4444' : '#9ca3af'}}
                                className="hover:bg-red-50 dark:hover:bg-red-900/20 hover:text-red-500">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill={isLiked?"currentColor":"none"} stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                {likes > 0 && <span>{likes}</span>}
                            </button>
                            {/* Comment */}
                            <button onClick={() => setShowCommentModal(true)}
                                style={{display:'flex',alignItems:'center',gap:'5px',padding:'6px 10px',borderRadius:'10px',border:'none',cursor:'pointer',fontSize:'12px',fontWeight:600,transition:'all 0.15s',background:'transparent',color:'#9ca3af'}}
                                className="hover:bg-blue-50 dark:hover:bg-blue-900/20 hover:text-blue-500">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                                {commentCount > 0 && <span>{commentCount}</span>}
                            </button>
                            {/* Share */}
                            <div style={{position:'relative'}}>
                                <button onClick={() => setShareOpen(!shareOpen)}
                                    style={{display:'flex',alignItems:'center',gap:'5px',padding:'6px 10px',borderRadius:'10px',border:'none',cursor:'pointer',fontSize:'12px',fontWeight:600,transition:'all 0.15s',background:'transparent',color:'#9ca3af'}}
                                    className="hover:bg-green-50 dark:hover:bg-green-900/20 hover:text-green-600">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                                </button>
                                {shareOpen && <ShareModal onShare={handleShare} onClose={() => setShareOpen(false)} />}
                            </div>
                            {/* Save */}
                            <button onClick={handleSave}
                                style={{display:'flex',alignItems:'center',gap:'5px',padding:'6px 10px',borderRadius:'10px',border:'none',cursor:'pointer',fontSize:'12px',fontWeight:600,transition:'all 0.15s',
                                    background: isSaved ? 'rgba(245,166,35,0.1)' : 'transparent',
                                    color: isSaved ? '#F5A623' : '#9ca3af'}}
                                className="hover:bg-amber-50 dark:hover:bg-amber-900/20 hover:text-amber-500">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill={isSaved?"currentColor":"none"} stroke="currentColor" strokeWidth="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                            </button>

                                Read More
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>
