                                </div>
                                <p style={{fontSize:'12px',color:'#6b7280',marginTop:'var(--space-3)'}}>
                                    📧 <a href="mailto:kwtnews.com@gmail.com" className="link-underline" style={{color:'#9ca3af',textDecoration:'none'}}>kwtnews.com@gmail.com</a>
                                </p>
                            </div>
                        </div>
                        
                        <div style={{borderTop:'1px solid rgba(255,255,255,0.08)',paddingTop:'var(--space-5)',display:'flex',flexDirection:'column',alignItems:'center',gap:'var(--space-3)'}}>
                            <p style={{fontSize:'12px',color:'#6b7280',textAlign:'center'}}>
                                {t('copyright').replace('2026', currentYear)}
                            </p>
                            <p style={{fontSize:'11px',color:'#4b5563',textAlign:'center'}}>
                                Made with ❤️ in Kuwait
                            </p>
                        </div>
                    </div>
                </footer>
            );
        };

        // ==========================================
        // ERROR BOUNDARY
        // ==========================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error('Error caught by boundary:', error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'var(--space-6)',background:'var(--color-bg)',color:'var(--color-text-primary)'}}>
                            <div style={{fontSize:'64px',marginBottom:'var(--space-4)'}}>😕</div>
                            <h1 style={{fontWeight:700,fontSize:'24px',marginBottom:'var(--space-3)',textAlign:'center'}}>Something went wrong</h1>
                            <p style={{fontSize:'14px',color:'var(--color-text-muted)',textAlign:'center',maxWidth:'400px',marginBottom:'var(--space-5)'}}>
                                We apologize for the inconvenience. Please try refreshing the page or contact support if the problem persists.
                            </p>
                            <button onClick={() => window.location.reload()} className="btn-interactive" style={{padding:'var(--space-3) var(--space-5)',background:'#F5A623',color:'#0A1628',fontWeight:700,borderRadius:'var(--radius-lg)',border:'none',cursor:'pointer'}}>
                                Refresh Page
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        
        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        const App = () => {
            const { t } = useTranslation();
            const { user, loading: authLoading } = useAuth();
            const { notifications, removeNotification } = useNotifications();
            const [activeTab, setActiveTab] = useState('all');
            const [refreshKey, setRefreshKey] = useState(0);
            const [selectedNews, setSelectedNews] = useState(null);
            const [likedPosts, setLikedPosts] = useState([]);
            const [savedPosts, setSavedPosts] = useState([]);
            const [appReady, setAppReady] = useState(false);
            const [showInstallPrompt, setShowInstallPrompt] = useState(false);
            const [isOnline, setIsOnline] = useState(true);
            const [breakingNews, setBreakingNews] = useState([]);
            const { news, loading: newsLoading, hasMore, loadMore } = useNews(activeTab, 15, refreshKey);
            const [allNewsLoaded, setAllNewsLoaded] = useState(false);
            const observerRef = useRef(null);
            const loadMoreRef = useRef(null);

            // App initialization
            useEffect(() => {
                const timer = setTimeout(() => {
                    setAppReady(true);
                    const loader = document.getElementById('initial-loader');
                    if (loader) loader.style.display = 'none';
                }, 1500);
                return () => clearTimeout(timer);
            }, []);

            // Online status
            useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                setIsOnline(navigator.onLine);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            // Install prompt
            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    window.deferredPrompt = e;
                    if (localStorage.getItem('installPromptDismissed') !== 'true') {
                        setTimeout(() => setShowInstallPrompt(true), 3000);
                    }
                };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            // User data
            useEffect(() => {
                if (!user) { setLikedPosts([]); setSavedPosts([]); return; }
                const unsub = db.collection('users').doc(user.uid).onSnapshot(snap => {
                    if (snap.exists) {
                        const data = snap.data();
                        setLikedPosts(data.likedPosts || []);
                        setSavedPosts(data.savedPosts || []);
                    }
                }, () => {});
                return () => unsub();
            }, [user?.uid]);

            // Breaking news
            useEffect(() => {
                const unsub = db.collection('news')
                    .where('isBreaking', '==', true)
                    .where('active', '==', true)
                    .orderBy('timestamp', 'desc')
                    .limit(3)
                    .onSnapshot(snap => {
                        const items = snap.docs.map(d => ({ id: d.id, ...d.data(), timestamp: d.data().timestamp?.toDate() }));
                        setBreakingNews(items);
                    }, () => {});
                return () => unsub();
            }, []);

            // Intersection observer for infinite scroll
            useEffect(() => {
                if (!loadMoreRef.current || !hasMore) return;
                observerRef.current = new IntersectionObserver(
                    (entries) => {
                        if (entries[0].isIntersecting && hasMore && !newsLoading) {
                            loadMore();
                        }
                    },
                    { rootMargin: '200px' }
                );
                observerRef.current.observe(loadMoreRef.current);
                return () => observerRef.current?.disconnect();
            }, [hasMore, newsLoading, loadMore]);

            // Handle all news loaded
            useEffect(() => {
                if (!hasMore && news.length > 0) {
                    setAllNewsLoaded(true);
                }
            }, [hasMore, news.length]);

            const handleLikeToggle = (newsId, liked) => {
                setLikedPosts(prev => liked ? [...prev, newsId] : prev.filter(id => id !== newsId));
            };

            const handleSaveToggle = (newsId, saved) => {
                setSavedPosts(prev => saved ? [...prev, newsId] : prev.filter(id => id !== newsId));
            };

            const handleReadMore = (newsItem) => {
                setSelectedNews(newsItem);
                document.body.style.overflow = 'hidden';
            };

            const closeNewsDetail = () => {
                setSelectedNews(null);
                document.body.style.overflow = '';
            };

            const handleInstall = async () => {
                const deferredPrompt = window.deferredPrompt;
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        window.deferredPrompt = null;
                        setShowInstallPrompt(false);
                    }
                }
            };

            const dismissInstall = () => {
                setShowInstallPrompt(false);
                localStorage.setItem('installPromptDismissed', 'true');
            };

            if (!appReady) return null;

            return (
                <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',background:'var(--color-bg)'}}>
                    {/* Offline indicator */}
                    {!isOnline && (
                        <div style={{position:'fixed',top:0,left:0,right:0,zIndex:100,background:'#ef4444',color:'white',textAlign:'center',padding:'6px',fontSize:'12px',fontWeight:600}}>
                            ⚠️ You're offline. Some features may be unavailable.
                        </div>
                    )}

                    {/* Breaking news ticker */}
                    {breakingNews.length > 0 && (
                        <div className="breaking-ticker" style={{position:'relative',zIndex:35,padding:'8px 0',overflow:'hidden'}}>
                            <div style={{display:'flex',animation:'marqueeScroll 30s linear infinite',whiteSpace:'nowrap'}}>
                                {[...breakingNews, ...breakingNews].map((item, i) => (
                                    <span key={i} onClick={() => handleReadMore(item)} style={{padding:'0 40px',fontSize:'13px',fontWeight:600,color:'white',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:'8px'}}>
                                        <span style={{background:'#dc2626',color:'white',fontSize:'9px',fontWeight:800,padding:'2px 8px',borderRadius:'4px',textTransform:'uppercase'}}>🚨 BREAKING</span>
                                        {item.title}
                                    </span>
                                ))}
                            </div>
                        </div>
                    )}

                    <Header activeTab={activeTab} setActiveTab={setActiveTab} onReadMore={handleReadMore} />

                    {/* Toast notifications */}
                    <div style={{position:'fixed',top:'80px',right:'16px',zIndex:200,display:'flex',flexDirection:'column',gap:'8px',pointerEvents:'none',maxWidth:'380px'}}>
                        {notifications.map(n => (
                            <div key={n.id} style={{pointerEvents:'all'}}>
                                <Toast message={n.message} type={n.type} onClose={() => removeNotification(n.id)} />
                            </div>
                        ))}
                    </div>

                    {/* Main content */}
                    <main style={{flex:1,padding:'var(--space-4) 0',maxWidth:'1280px',margin:'0 auto',width:'100%'}}>
                        <div style={{display:'grid',gridTemplateColumns:'1fr',gap:'var(--space-5)',padding:'0 var(--space-4)'}}>
                            {/* News feed */}
                            <div style={{maxWidth:'800px',margin:'0 auto',width:'100%'}}>
                                {activeTab === 'all' && (
                                    <div className="animate-fade-in-up" style={{marginBottom:'var(--space-5)'}}>
                                        <AdBanner position="feed_top" />
                                    </div>
                                )}

                                {newsLoading && news.length === 0 ? (
                                    <>
                                        {[1,2,3].map(i => <NewsCardSkeleton key={i} />)}
                                    </>
                                ) : news.length === 0 ? (
                                    <div style={{textAlign:'center',padding:'var(--space-10) var(--space-4)'}}>
                                        <div className="empty-state-icon">📰</div>
                                        <h3 style={{fontWeight:700,fontSize:'18px',marginBottom:'var(--space-2)',color:'var(--color-text-primary)'}}>{t('noResults')}</h3>
                                        <p style={{fontSize:'14px',color:'var(--color-text-muted)'}}>Try selecting a different category</p>
                                    </div>
                                ) : (
                                    <>
                                        {news.map((item, index) => (
                                            <NewsCard
                                                key={item.id}
                                                news={item}
                                                index={index}
                                                onReadMore={handleReadMore}
                                                likedPosts={likedPosts}
                                                savedPosts={savedPosts}
                                                onLikeToggle={handleLikeToggle}
                                                onSaveToggle={handleSaveToggle}
                                            />
                                        ))}

                                        {/* Load more trigger */}
                                        {hasMore && (
                                            <div ref={loadMoreRef} style={{padding:'var(--space-5) 0',textAlign:'center'}}>
                                                <div className="spinner" style={{width:'24px',height:'24px',border:'2px solid var(--color-border)',borderTopColor:'#F5A623',borderRadius:'50%',margin:'0 auto'}}></div>
                                            </div>
                                        )}

                                        {/* All loaded message */}
                                        {allNewsLoaded && (
                                            <div style={{textAlign:'center',padding:'var(--space-8) var(--space-4)'}}>
                                                <div style={{fontSize:'48px',marginBottom:'var(--space-3)'}}>🎉</div>
                                                <h3 style={{fontWeight:700,fontSize:'16px',marginBottom:'var(--space-2)',color:'var(--color-text-primary)'}}>{t('youveReadAll')}</h3>
                                                <p style={{fontSize:'13px',color:'var(--color-text-muted)'}}>{t('allNewsLoaded')}</p>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>

                            {/* Sidebar - hidden on mobile */}
                            <div className="sidebar" style={{display:'none'}}>
                                <Sidebar onReadMore={handleReadMore} />
                            </div>
                        </div>
                    </main>

                    <Footer />

                    {/* News detail modal */}
                    {selectedNews && (
                        <NewsDetailModal news={selectedNews} onClose={closeNewsDetail} />
                    )}

                    {/* Install prompt */}
                    {showInstallPrompt && (
                        <div style={{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',zIndex:250,background:'var(--color-primary)',border:'1px solid rgba(245,166,35,0.3)',borderRadius:'var(--radius-xl)',padding:'var(--space-4) var(--space-5)',boxShadow:'var(--shadow-float)',display:'flex',alignItems:'center',gap:'var(--space-4)',animation:'modalUp 0.4s ease',maxWidth:'90vw'}}>
                            <div>
                                <div style={{fontWeight:700,fontSize:'14px',color:'#F5A623',marginBottom:'2px'}}>📱 Add KWT News to Home Screen</div>
                                <div style={{fontSize:'12px',color:'#9ca3af'}}>Get instant access to breaking news</div>
                            </div>
                            <button onClick={handleInstall} className="btn-interactive" style={{background:'#F5A623',color:'#0A1628',padding:'10px 20px',borderRadius:'999px',fontWeight:700,fontSize:'13px',border:'none',cursor:'pointer',whiteSpace:'nowrap'}}>
                                Install
                            </button>
                            <button onClick={dismissInstall} style={{color:'#9ca3af',background:'none',border:'none',cursor:'pointer',padding:'8px'}}>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // RENDER APP
        // ==========================================
        const root = createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <ThemeProvider>
                    <AuthProvider>
                        <LanguageProvider>
                            <NotificationProvider>
                                <App />
                            </NotificationProvider>
                        </LanguageProvider>
                    </AuthProvider>
                </ThemeProvider>
            </ErrorBoundary>
        );
    </script>

    <!-- PWA Install Functions -->
    <script>
        function installPWA() {
            const deferredPrompt = window.deferredPrompt;
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(({ outcome }) => {
                    if (outcome === 'accepted') {
                        window.deferredPrompt = null;
                        document.getElementById('install-prompt').classList.remove('show');
                    }
                });
            }
        }
        function dismissInstall() {
            document.getElementById('install-prompt').classList.remove('show');
            localStorage.setItem('installPromptDismissed', 'true');
        }
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered:', reg))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
  </html>
