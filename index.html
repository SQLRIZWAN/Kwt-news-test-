<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KWT News | Kuwait & World Real-Time Updates</title>
    
    <meta name="description" content="KWT News delivers real-time breaking news from Kuwait and across the globe.">
    <meta name="robots" content="index, follow">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { navy: '#0A1628', golden: '#F5A623', darkbg: '#0F172A', cardDark: '#1E293B' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* Modal Animation */
        .modal-enter { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #F5A623; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-gray-100 antialiased selection:bg-golden selection:text-navy">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyDLRqQ8WRohNDWz_6UgafI7Kn2f8U0KL3c",
            authDomain: "kwt-news.firebaseapp.com",
            databaseURL: "https://kwt-news-default-rtdb.firebaseio.com",
            projectId: "kwt-news",
            storageBucket: "kwt-news.firebasestorage.app",
            messagingSenderId: "604704031845",
            appId: "1:604704031845:web:b835af9ab1872ddd1d728c",
            measurementId: "G-J161YE3FDP"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- COMPONENTS ---

        const Header = ({ theme, toggleTheme, activeTab, setActiveTab }) => (
            <header className="sticky top-0 z-50 bg-white/80 dark:bg-navy/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-800 transition-colors duration-300">
                <div className="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('HOME')}>
                        <div className="bg-navy dark:bg-cardDark p-1.5 rounded-lg shadow-inner border border-gray-700">
                            <svg width="24" height="24" viewBox="0 0 100 100" fill="none"><path d="M25 70V30L50 50L75 30V70" stroke="#F5A623" strokeWidth="10" strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight">KWT <span className="text-golden">News</span></span>
                    </div>

                    <nav className="flex gap-4 md:gap-8">
                        {['HOME', 'KUWAIT', 'WORLD'].map(tab => (
                            <button 
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`font-bold text-xs md:text-sm tracking-wide transition-all duration-200 h-16 flex items-center border-b-2 ${activeTab === tab ? 'text-golden border-golden' : 'text-gray-500 border-transparent hover:text-navy dark:hover:text-gray-200'}`}
                            >
                                {tab}
                            </button>
                        ))}
                    </nav>

                    <div className="flex items-center">
                        <button onClick={toggleTheme} className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors">
                            {theme === 'dark' ? <i className="fas fa-sun text-lg"></i> : <i className="fas fa-moon text-lg"></i>}
                        </button>
                    </div>
                </div>
            </header>
        );

        const NewsCard = ({ article, onClick }) => (
            <div 
                onClick={() => onClick(article)}
                className="bg-white dark:bg-cardDark rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 mb-6 overflow-hidden transition-all duration-300 hover:shadow-lg hover:-translate-y-1 cursor-pointer group"
            >
                <div className="p-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        <div className="h-10 w-10 bg-gradient-to-br from-golden to-yellow-600 rounded-full flex items-center justify-center text-navy font-bold shadow-sm">
                            {article.publisher ? article.publisher.charAt(0).toUpperCase() : 'K'}
                        </div>
                        <div>
                            <h4 className="font-bold text-sm text-gray-900 dark:text-white">{article.publisher || "Editorial"}</h4>
                            <div className="flex items-center text-[11px] font-semibold text-gray-500 dark:text-gray-400 gap-1.5">
                                <span className="text-golden tracking-wider uppercase">{article.category || 'News'}</span>
                                <span>•</span>
                                <span>{article.timeLabel || "Just now"}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="px-4 pb-4">
                    <h2 className="text-xl md:text-2xl font-bold mb-2 leading-tight text-gray-900 dark:text-gray-50 group-hover:text-golden transition-colors">{article.title}</h2>
                    <p className="text-sm text-gray-600 dark:text-gray-300 line-clamp-2 leading-relaxed">{article.summary || article.content}</p>
                </div>

                {article.image && (
                    <div className="relative overflow-hidden">
                        <img src={article.image} alt="news" className="w-full h-64 md:h-80 object-cover bg-gray-200 dark:bg-gray-800 transition-transform duration-500 group-hover:scale-105" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    </div>
                )}

                <div className="px-4 py-3 flex justify-between items-center border-t border-gray-50 dark:border-gray-800/50 bg-gray-50/50 dark:bg-cardDark/50">
                    <div className="flex gap-5">
                        <button className="flex items-center gap-1.5 text-gray-500 dark:text-gray-400 text-sm font-medium hover:text-red-500 transition-colors" onClick={(e) => e.stopPropagation()}>
                            <i className="far fa-heart"></i> <span>{article.likes || 0}</span>
                        </button>
                        <button className="flex items-center gap-1.5 text-gray-500 dark:text-gray-400 text-sm font-medium hover:text-blue-500 transition-colors" onClick={(e) => e.stopPropagation()}>
                            <i className="far fa-comment"></i> <span>{article.comments || 0}</span>
                        </button>
                    </div>
                    <button className="text-gray-500 dark:text-gray-400 hover:text-golden transition-colors p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700" onClick={(e) => e.stopPropagation()}>
                        <i className="fas fa-share-alt"></i>
                    </button>
                </div>
            </div>
        );

        const ArticleModal = ({ article, onClose }) => {
            if (!article) return null;

            // Close modal on Escape key
            useEffect(() => {
                const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handleEsc);
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
                return () => {
                    window.removeEventListener('keydown', handleEsc);
                    document.body.style.overflow = 'auto';
                };
            }, [onClose]);

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 bg-black/60 backdrop-blur-sm transition-opacity">
                    <div className="modal-enter relative w-full max-w-2xl max-h-[90vh] flex flex-col bg-white dark:bg-cardDark rounded-2xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-700">
                        
                        {/* Modal Header */}
                        <div className="flex justify-between items-center p-4 border-b border-gray-100 dark:border-gray-800 bg-white dark:bg-cardDark sticky top-0 z-10">
                            <div className="flex items-center text-[11px] font-bold text-gray-500 dark:text-gray-400 gap-2 uppercase tracking-wider">
                                <span className="text-golden">{article.category || 'News'}</span>
                                <span>• {article.timeLabel || "Recently"}</span>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-red-500 hover:text-white transition-colors">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        {/* Modal Body */}
                        <div className="overflow-y-auto p-0">
                            {article.image && (
                                <img src={article.image} alt={article.title} className="w-full h-64 sm:h-80 object-cover bg-gray-100 dark:bg-gray-800" />
                            )}
                            <div className="p-6">
                                <h1 className="text-2xl sm:text-3xl font-extrabold mb-4 text-gray-900 dark:text-white leading-tight">
                                    {article.title}
                                </h1>
                                <div className="flex items-center gap-3 mb-6 pb-6 border-b border-gray-100 dark:border-gray-800">
                                     <div className="h-10 w-10 bg-gradient-to-br from-golden to-yellow-600 rounded-full flex items-center justify-center text-navy font-bold shadow-sm">
                                        {article.publisher ? article.publisher.charAt(0).toUpperCase() : 'K'}
                                    </div>
                                    <div>
                                        <p className="font-bold text-sm text-gray-900 dark:text-gray-200">{article.publisher || "KWT Editorial"}</p>
                                        <p className="text-xs text-gray-500 dark:text-gray-400">Author & Reporter</p>
                                    </div>
                                </div>
                                <div className="prose dark:prose-invert max-w-none text-gray-700 dark:text-gray-300 text-base leading-relaxed space-y-4">
                                    <p>{article.content || article.summary || "Full article content goes here. The reporter is updating the complete details shortly."}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [theme, setTheme] = useState('dark');
            const [activeTab, setActiveTab] = useState('HOME');
            const [articles, setArticles] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedArticle, setSelectedArticle] = useState(null);

            // Set initial theme based on HTML class
            useEffect(() => {
                if (document.documentElement.classList.contains('dark')) {
                    setTheme('dark');
                } else {
                    setTheme('light');
                }
            }, []);

            useEffect(() => {
                setLoading(true);
                // Removed .where() to prevent missing index errors. 
                // We fetch all recent news and filter on the client side.
                const q = db.collection("articles").orderBy("timestamp", "desc").limit(50);

                const unsubscribe = q.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => {
                        const docData = doc.data();
                        let timeString = "Just now";
                        if (docData.timestamp) {
                            timeString = docData.timestamp.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        }
                        return {
                            id: doc.id,
                            ...docData,
                            timeLabel: timeString
                        };
                    });
                    setArticles(data);
                    setLoading(false);
                }, (error) => {
                    console.error("Firestore Error:", error);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []); // Re-run only on mount, not on tab change

            const toggleTheme = () => {
                const newTheme = theme === 'dark' ? 'light' : 'dark';
                setTheme(newTheme);
                document.documentElement.classList.toggle('dark');
            };

            // Client-side filtering logic
            const filteredArticles = articles.filter(article => {
                if (activeTab === 'HOME') return true;
                return article.category && article.category.toUpperCase() === activeTab;
            });

            return (
                <div className="min-h-screen flex flex-col">
                    <Header theme={theme} toggleTheme={toggleTheme} activeTab={activeTab} setActiveTab={setActiveTab} />
                    
                    <main className="flex-grow max-w-3xl mx-auto w-full px-4 py-6 md:py-10">
                        {loading ? (
                            <div className="flex flex-col items-center justify-center py-32 space-y-4">
                                <div className="animate-spin rounded-full h-12 w-12 border-4 border-gray-200 dark:border-gray-700 border-t-golden"></div>
                                <p className="text-gray-500 font-medium animate-pulse">Fetching latest news...</p>
                            </div>
                        ) : filteredArticles.length > 0 ? (
                            <div className="space-y-6">
                                {filteredArticles.map(article => (
                                    <NewsCard 
                                        key={article.id} 
                                        article={article} 
                                        onClick={(art) => setSelectedArticle(art)} 
                                    />
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-32 bg-white dark:bg-cardDark rounded-2xl border border-dashed border-gray-300 dark:border-gray-700">
                                <i className="fas fa-newspaper text-6xl text-gray-300 dark:text-gray-600 mb-4"></i>
                                <h3 className="text-xl font-bold text-gray-700 dark:text-gray-300 mb-2">No News Found</h3>
                                <p className="text-gray-500 dark:text-gray-500">There are currently no articles in the {activeTab} section.</p>
                            </div>
                        )}
                    </main>

                    <footer className="bg-white dark:bg-navy border-t border-gray-200 dark:border-gray-800 py-8 text-center mt-auto">
                        <div className="flex justify-center gap-6 mb-4">
                            <i className="fab fa-twitter text-gray-400 hover:text-golden cursor-pointer text-xl transition-colors"></i>
                            <i className="fab fa-facebook text-gray-400 hover:text-golden cursor-pointer text-xl transition-colors"></i>
                            <i className="fab fa-instagram text-gray-400 hover:text-golden cursor-pointer text-xl transition-colors"></i>
                        </div>
                        <p className="text-sm font-medium text-gray-500">&copy; 2026 KWT News Network.</p>
                        <p className="text-xs text-gray-400 mt-1">Real-time updates from Kuwait & The World</p>
                    </footer>

                    {/* Render the Modal */}
                    <ArticleModal 
                        article={selectedArticle} 
                        onClose={() => setSelectedArticle(null)} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
  </html>
