    <!-- Google Translate -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                autoDisplay: true,
                includedLanguages: 'en,ar,ur,hi,fr,bn,ml,ta,tl,te',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
        function setGoogleTranslateLang(lang) {
            if (lang === 'en') {
                document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + window.location.hostname;
                var iframe = document.querySelector('.goog-te-banner-frame');
                if (iframe) iframe.style.display = 'none';
                var el = document.getElementById(':1.container');
                if (el) el.click();
                return;
            }
            document.cookie = 'googtrans=/en/' + lang + '; path=/';
            document.cookie = 'googtrans=/en/' + lang + '; path=/; domain=' + window.location.hostname;
            var sel = document.querySelector('.goog-te-combo');
            if (sel) {
                sel.value = lang;
                sel.dispatchEvent(new Event('change'));
            }
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <!-- Dark Mode FOUC Prevention -->
    <script>
        (function(){
            try {
                var saved = localStorage.getItem('theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var isDark = saved ? saved === 'dark' : prefersDark;
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.colorScheme = 'dark';
                }
            } catch(e) {}
        })();
    </script>

    <!-- Error Suppression -->
    <script>
        window.onerror = function(msg, src, line, col, err) {
            if (!msg || msg === 'Script error.' || msg === 'Script error') return true;
            return false;
        };
        window.addEventListener('unhandledrejection', function(e) {
            console.warn('Unhandled promise:', e.reason);
            e.preventDefault();
        });
    </script>

    <style>
        /* =============================================
           KWT NEWS — PREMIUM UI v3.0
           Design System: Editorial-luxury news platform
           Deep navy + warm gold on crisp surfaces
        ============================================= */

        /* ── Design Tokens ── */
        :root {
            /* Spacing Scale (4px base) */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;
            --space-8: 64px;
            --space-9: 96px;

            /* Colors - Light Mode */
            --color-primary: #0A1628;
            --color-accent: #F5A623;
            --color-accent-hover: #FFB84D;
            --color-accent-active: #D4890F;
            --color-surface: #FFFFFF;
            --color-surface-raised: #F8FAFC;
            --color-bg: #F1F5F9;
            --color-text-primary: #0F172A;
            --color-text-secondary: #334155;
            --color-text-muted: #64748B;
            --color-border: rgba(15, 23, 42, 0.08);
            --color-border-strong: rgba(15, 23, 42, 0.15);

            /* Shadows - Multi-layer, color-tinted */
            --shadow-xs: 0 1px 2px rgba(10, 22, 40, 0.04);
            --shadow-sm: 0 1px 3px rgba(10, 22, 40, 0.06), 0 1px 2px rgba(10, 22, 40, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(10, 22, 40, 0.06), 0 2px 4px -2px rgba(10, 22, 40, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(10, 22, 40, 0.08), 0 4px 6px -4px rgba(10, 22, 40, 0.04);
            --shadow-xl: 0 20px 25px -5px rgba(10, 22, 40, 0.1), 0 8px 10px -6px rgba(10, 22, 40, 0.04);
            --shadow-float: 0 25px 50px -12px rgba(10, 22, 40, 0.18);
            --shadow-glow: 0 0 20px rgba(245, 166, 35, 0.25);

            /* Border Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;

            /* Typography */
            --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-body: 'Source Serif 4', Georgia, serif;
            
            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Dark Mode Tokens */
        .dark {
            --color-surface: #16213E;
            --color-surface-raised: #1E2A4A;
            --color-bg: #0D0D0D;
            --color-text-primary: #F1F5F9;
            --color-text-secondary: #CBD5E1;
            --color-text-muted: #8B95A8;
            --color-border: rgba(255, 255, 255, 0.06);
            --color-border-strong: rgba(255, 255, 255, 0.12);

            /* Dark Mode Shadows - with warm tint */
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --shadow-float: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 30px rgba(245, 166, 35, 0.2);
        }

        /* ── Base Reset ── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-display);
            background: var(--color-bg);
            color: var(--color-text-primary);
            line-height: 1.6;
            -webkit-user-select: text;
            -moz-user-select: text;
            user-select: text;
            top: 0 !important;
        }

        /* ── Typography Scale with Fluid Sizing ── */
        .text-display {
            font-size: clamp(2.5rem, 5vw + 1rem, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .text-h1 {
            font-size: clamp(1.875rem, 3vw + 0.5rem, 3rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .text-h2 {
            font-size: clamp(1.5rem, 2vw + 0.5rem, 2.25rem);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }

        .text-h3 {
            font-size: clamp(1.25rem, 1.5vw + 0.5rem, 1.5rem);
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .text-body {
            font-size: clamp(0.9375rem, 1vw + 0.5rem, 1.0625rem);
            font-weight: 400;
            line-height: 1.7;
        }

        .text-small {
            font-size: 0.8125rem;
            font-weight: 500;
            line-height: 1.5;
        }

        .text-caption {
            font-size: 0.6875rem;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* ── Smooth Theme Transitions ── */
        * {
            transition: background-color var(--transition-base),
                        border-color var(--transition-fast),
                        color var(--transition-fast);
        }

        /* Exclude certain elements from transitions */
        img, video, .no-transition, .reading-progress-bar {
            transition: none !important;
        }

        /* ── Custom Scrollbar ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 166, 35, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-accent);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ── RTL Support ── */
        [dir="rtl"] .rtl-flip {
            transform: scaleX(-1);
        }

        /* ── Line Clamp Utilities ── */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── Google Translate Overrides ── */
        .goog-te-banner-frame, .skiptranslate {
            display: none !important;
        }
        #google_translate_element {
            display: none !important;
        }

        /* ── Selection Color ── */
        ::selection {
            background: rgba(245, 166, 35, 0.25);
            color: inherit;
        }

        /* =============================================
           MICRO-INTERACTIONS
        ============================================= */

        /* ── Button Interactions ── */
        .btn-interactive {
            transition: transform var(--transition-fast),
                        box-shadow var(--transition-base),
                        background-color var(--transition-fast);
        }
        .btn-interactive:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-interactive:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        /* ── Card Interactions ── */
        .card-interactive {
            transition: transform var(--transition-slow),
                        box-shadow var(--transition-slow),
                        border-color var(--transition-base);
        }
        .card-interactive:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: rgba(245, 166, 35, 0.3);
        }

        /* ── Link Underline Animation ── */
        .link-underline {
            position: relative;
        }
        .link-underline::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--color-accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform var(--transition-base);
        }
        .link-underline:hover::after {
            transform: scaleX(1);
        }

        /* ── Input Focus States ── */
        .input-focus {
            transition: border-color var(--transition-fast),
                        box-shadow var(--transition-fast);
        }
        .input-focus:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
        }

        /* ── Page Load Animations ── */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        /* ── Skeleton Shimmer ── */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .skeleton {
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
        }

        /* ── Spinner Animation ── */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 0.7s linear infinite;
        }

        /* ── Toast Slide In ── */
        @keyframes toastSlideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes toastSlideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }
        .toast-enter {
            animation: toastSlideIn 0.35s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
        }
        .toast-exit {
            animation: toastSlideOut 0.28s ease forwards;
        }

        /* ── Modal Animations ── */
        @keyframes modalUp {
            from {
                transform: translateY(60px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes drawerSlideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes backdropFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ── Progress Bar Glow ── */
        @keyframes progressGlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ── Marquee Animation ── */
        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ── Pulse Animation for Live Indicators ── */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* =============================================
           COMPONENT STYLES
        ============================================= */

        /* ── News Card Premium ── */
        .news-card-premium {
            border-radius: var(--radius-xl);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            background: var(--color-surface);
            overflow: hidden;
        }
        .news-card-premium:hover {
            border-color: rgba(245, 166, 35, 0.25);
            box-shadow: var(--shadow-lg);
        }
        .dark .news-card-premium {
            border-color: rgba(255, 255, 255, 0.06);
        }
        .dark .news-card-premium:hover {
            border-color: rgba(245, 166, 35, 0.2);
            box-shadow: var(--shadow-xl);
        }

        /* Card Image Zoom */
        .news-card-image {
            transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .news-card-premium:hover .news-card-image {
            transform: scale(1.04);
        }

        /* ── Header Glassmorphism ── */
        .header-glass {
            background: rgba(10, 22, 40, 0.95);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ── Tab Buttons ── */
        .tab-btn {
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-full);
            font-size: 0.8125rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        .tab-btn:active {
            transform: scale(0.96);
        }
        .tab-btn.active {
            background: var(--color-accent);
            color: var(--color-primary);
            box-shadow: 0 2px 12px rgba(245, 166, 35, 0.45);
        }
        .tab-btn.inactive {
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.65);
        }
        .tab-btn.inactive:hover {
            background: rgba(255, 255, 255, 0.13);
            color: rgba(255, 255, 255, 0.9);
        }

        /* ── Action Buttons ── */
        .action-btn {
            min-height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-1);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }
        .action-btn:active {
            transform: scale(0.92);
        }

        /* ── Drawer Panel ── */
        .drawer-panel {
            background: rgba(10, 22, 40, 0.98);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-left: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ── Toast Premium ── */
        .toast-premium {
            border-radius: var(--radius-lg);
            padding: var(--space-3) var(--space-4);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            animation: toastSlideIn 0.35s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
            min-width: 220px;
            max-width: 380px;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ── Reading Progress Bar ── */
        .reading-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            z-index: 9999;
            background: linear-gradient(90deg, #F5A623 0%, #FFB84D 50%, #F5A623 100%);
            background-size: 200% 100%;
            animation: progressGlow 2.5s linear infinite;
            transition: width 0.1s ease-out;
            border-radius: 0 2px 2px 0;

        const NotificationProvider = ({ children }) => {
            const [notifications, setNotifications] = useState([]);

            const shownIds = useRef(new Set());

            useEffect(() => {
                const unsub = db.collection('notifications')
                    .where('active', '==', true)
                    .orderBy('timestamp', 'desc')
                    .limit(20)
                    .onSnapshot(snap => {
                        snap.docChanges().forEach(change => {
                            if (change.type === 'added') {
                                const data = change.doc.data();
                                const id = change.doc.id;
                                if (!shownIds.current.has(id)) {
                                    shownIds.current.add(id);
                                    const age = Date.now() - (data.timestamp?.toMillis?.() || 0);
                                    if (age < 60000) {
                                        addNotification({ message: data.message || data.title || 'New notification', type: data.type || 'info' });
                                    }
                                }
                            }
                        });
                    }, () => {});
                return () => unsub();
            }, []);
            
            const addNotification = (notification) => {
                const id = Date.now() + Math.random();
                setNotifications(prev => [{ id, ...notification }, ...prev]);
                if (!notification.read) setUnreadCount(prev => prev + 1);
                setTimeout(() => removeNotification(id), 5000);
            };
            
            const removeNotification = (id) => {
                setNotifications(prev => prev.filter(n => n.id !== id));
            };
            
            const markAllAsRead = () => {
                setUnreadCount(0);
                setNotifications(prev => prev.map(n => ({ ...n, read: true })));
            };
            
            return (
                <NotificationContext.Provider value={{ 
                    notifications, unreadCount, addNotification, removeNotification, markAllAsRead
                }}>
                    {children}
                </NotificationContext.Provider>
            );

        const useFocusTrap = (containerRef) => {
            useEffect(() => {
                try {
                    if (!containerRef || !containerRef.current) return;
                    const el = containerRef.current;
                    const getFocusable = () => Array.from(el.querySelectorAll("button:not([disabled]), [href], input:not([disabled]), select, textarea"));
                    const handleTab = (e) => {
                        if (e.key !== 'Tab') return;
                        const focusable = getFocusable();
                        if (!focusable.length) return;
                        const first = focusable[0];
                        const last = focusable[focusable.length - 1];
                        if (e.shiftKey) {
                            if (document.activeElement === first) { e.preventDefault(); last.focus(); }
                        } else {
                            if (document.activeElement === last) { e.preventDefault(); first.focus(); }
                        }
                    };
                    el.addEventListener('keydown', handleTab);
                    return () => el.removeEventListener('keydown', handleTab);
                } catch(e) {}
            }, []);
        };

            const [hasMore, setHasMore] = useState(true);
            const lastDocRef = useRef(null);
            const mounted = useRef(true);
            const prevCategory = useRef(category);

            useEffect(() => {
                mounted.current = true;
                const categoryChanged = prevCategory.current !== category;
                prevCategory.current = category;

                if (categoryChanged) {
                    setLoading(true);
                    setNews([]);
                }
                setHasMore(true);
                lastDocRef.current = null;

                const timeout = setTimeout(() => { if (mounted.current) setLoading(false); }, 8000);

                let query;
                if (category === 'all') {
                    query = db.collection('news').orderBy('timestamp', 'desc');
                } else {
                    query = db.collection('news')
                        .where('category', '==', category)
                        .orderBy('timestamp', 'desc');
                }

                const fetchLimit = category === 'all' ? limit * 3 : limit;
                query = query.limit(fetchLimit);

                const unsubscribe = query.onSnapshot((snapshot) => {
                    clearTimeout(timeout);
                    if (!mounted.current) return;
                    let newsData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        timestamp: doc.data().timestamp?.toDate()
                    })).filter(n => !n.hidden && (!n.status || n.status === 'active' || n.status === 'Active'));
                    if (category === 'all') {
                        newsData = newsData.filter(n => !SPECIAL_CATEGORIES.includes(n.category));
                    }
                    lastDocRef.current = snapshot.docs[snapshot.docs.length - 1] || null;
                    setNews(newsData);
                    setLoading(false);
                    setHasMore(snapshot.docs.length === fetchLimit);
                }, (error) => {
                    clearTimeout(timeout);
                    if (!mounted.current) return;
                    console.error('News fetch error:', error);
                    setLoading(false);
                });

                return () => {
                    mounted.current = false;
                    clearTimeout(timeout);
                    unsubscribe();
                    lastDocRef.current = null;
                };
            }, [category, limit, refreshKey]);
            
            const loadMore = async () => {
                if (!lastDocRef.current) return;
                try {
                    let query = db.collection('news').orderBy('timestamp', 'desc');
                    if (category !== 'all') {
                        query = db.collection('news')
                            .where('category', '==', category)
                            .orderBy('timestamp', 'desc');
                    }
                    query = query.startAfter(lastDocRef.current).limit(limit);
                    
                    const snapshot = await query.get();
                    let newNews = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        timestamp: doc.data().timestamp?.toDate()
                    })).filter(n => !n.hidden && (!n.status || n.status === 'active' || n.status === 'Active'));
                    if (category === 'all') {
                        newNews = newNews.filter(n => !SPECIAL_CATEGORIES.includes(n.category));
                    }
                    
                    lastDocRef.current = snapshot.docs[snapshot.docs.length - 1] || lastDocRef.current;
                    setNews(prev => [...prev, ...newNews]);
                    setHasMore(snapshot.docs.length === limit);
                } catch (err) {
                    console.error('Load more error:', err);
                }

        const TimeAgo = ({ date }) => {
            const { t } = useTranslation();
            
            const getTimeAgo = (date) => {
                if (!date) return '';
                const seconds = Math.floor((new Date() - date) / 1000);
                if (seconds < 0) return t('justNow');
                if (seconds < 5) return t('justNow');
                let interval = seconds / 31536000;
                if (interval > 1) return Math.floor(interval) + 'y ' + t('ago');
                interval = seconds / 2592000;
                if (interval > 1) return Math.floor(interval) + 'mo ' + t('ago');
                interval = seconds / 86400;
                if (interval > 1) return Math.floor(interval) + ' ' + t('days') + ' ' + t('ago');
                interval = seconds / 3600;
                if (interval > 1) return Math.floor(interval) + ' ' + t('hours') + ' ' + t('ago');
                interval = seconds / 60;
                if (interval > 1) return Math.floor(interval) + ' ' + t('minutes') + ' ' + t('ago');
                return t('justNow');
            };
            
            return <span>{getTimeAgo(date)}</span>;

        const SearchModal = ({ onClose, onSelectNews }) => {
            const { t } = useTranslation();
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [loading, setLoading] = useState(false);
            const [searched, setSearched] = useState(false);
            const inputRef = useRef(null);
            const timerRef = useRef(null);
            const modalRef = useRef(null);
            useFocusTrap(modalRef);

            useEffect(() => {
                inputRef.current?.focus();
                const onKey = e => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                document.body.style.overflow = 'hidden';
                return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
            }, []);

            useEffect(() => {
                let cancelled = false;
                clearTimeout(timerRef.current);
                const q = query.trim().toLowerCase();
                if (q.length < 2) { setResults([]); setSearched(false); setLoading(false); return; }
                setLoading(true);
                timerRef.current = setTimeout(async () => {
                    if (cancelled) return;
                    try {
                        const snap = await db.collection('news')
                            .orderBy('timestamp', 'desc')
                            .limit(200)
                            .get();
                        if (cancelled) return;
                        const found = snap.docs
                            .map(d => ({ id: d.id, ...d.data(), timestamp: d.data().timestamp?.toDate() }))
                            .filter(n => !n.hidden && (!n.status || n.status === 'active' || n.status === 'Active'))
                            .filter(n => {
                                const title = (n.title || '').toLowerCase();
                                const summary = (n.summary || '').toLowerCase();
                                const content = (n.content || '').toLowerCase();
                                return title.includes(q) || summary.includes(q) || content.includes(q);
                            })
                            .slice(0, 20);
                        setResults(found);
                    } catch(e) {
                        if (!cancelled) { console.error('Search error:', e); setResults([]); }
                    }
                    if (!cancelled) { setLoading(false); setSearched(true); }
                }, 400);
                return () => { cancelled = true; clearTimeout(timerRef.current); };
            }, [query]);

            const HighlightText = ({ text, query }) => {
                if (!query || !text) return <span>{text}</span>;
                const idx = text.toLowerCase().indexOf(query.toLowerCase());
                if (idx === -1) return <span>{text}</span>;
                return (
                    <span>
                        {text.slice(0, idx)}
                        <mark style={{background:'rgba(245,166,35,0.35)',color:'inherit',borderRadius:'2px',padding:'0 2px'}}>{text.slice(idx, idx + query.length)}</mark>
                        {text.slice(idx + query.length)}
                    </span>
                );
            };

            return (
                <>
                <div style={{position:'fixed',inset:0,zIndex:190,background:'rgba(0,0,0,0.6)',backdropFilter:'blur(4px)',animation:'backdropFadeIn 0.2s ease'}} onClick={onClose}/>
                <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:195,display:'flex',flexDirection:'column',pointerEvents:'none'}}>
                    <div ref={modalRef} style={{pointerEvents:'all',width:'100%',maxWidth:'640px',margin:'0 auto',padding:'var(--space-3)',display:'flex',flexDirection:'column',maxHeight:'100vh'}}>
                        <div style={{background:'var(--color-primary)',borderRadius:'var(--radius-xl)',boxShadow:'var(--shadow-float)',border:'1px solid rgba(255,255,255,0.1)',overflow:'hidden',flexShrink:0}}>
                            <div style={{display:'flex',alignItems:'center',padding:'var(--space-4)',gap:'var(--space-3)'}}>
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                <input
                                    ref={inputRef}
                                    type="text"
                                    placeholder={t('search')}
                                    value={query}
                                    onChange={e => setQuery(e.target.value)}
                                    className="input-focus"
                                    style={{background:'transparent',border:'none',outline:'none',color:'white',fontSize:'15px',flex:1,fontFamily:'inherit'}}
                                />
                                {query ? (
                                    <button onClick={() => setQuery('')} className="btn-interactive" style={{color:'rgba(255,255,255,0.4)',background:'none',border:'none',cursor:'pointer',display:'flex',padding:'4px'}}>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                    </button>
                                ) : (
                                    <button onClick={onClose} style={{color:'rgba(255,255,255,0.35)',background:'rgba(255,255,255,0.08)',border:'none',cursor:'pointer',padding:'4px 8px',borderRadius:'6px',fontSize:'10px',letterSpacing:'0.05em'}}>ESC</button>
                                )}
                            </div>
                        </div>

                        {(loading || results.length > 0 || searched) && (
                            <div style={{background:'var(--color-primary)',borderRadius:'var(--radius-xl)',border:'1px solid rgba(255,255,255,0.1)',marginTop:'var(--space-2)',overflow:'hidden',flexShrink:0,maxHeight:'70vh',overflowY:'auto'}} className="hide-scrollbar">
                                {loading ? (
                                    <div style={{padding:'var(--space-5)',textAlign:'center'}}>
                                        <div className="spinner" style={{display:'inline-block',width:'24px',height:'24px',border:'2px solid rgba(255,255,255,0.1)',borderTopColor:'#F5A623',borderRadius:'50%'}}/>
                                        <p style={{color:'rgba(255,255,255,0.4)',fontSize:'12px',marginTop:'var(--space-2)'}}>Searching...</p>

                                        <div style={{fontSize:'28px',marginBottom:'6px'}}>🔍</div>
                                        <p style={{color:'rgba(255,255,255,0.4)',fontSize:'13px'}}>{t('noResults')} for "<strong style={{color:'#F5A623'}}>{query}</strong>"</p>
                                    </div>
                                ) : (

                                                    <HighlightText text={item.title} query={query}/>
                                                </p>
                                                {item.summary && (
                                                    <p style={{fontSize:'11px',color:'rgba(255,255,255,0.4)',lineHeight:1.4,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:1,WebkitBoxOrient:'vertical'}}>

                                                    </p>

                                            </div>
                                        </button>

                try { return localStorage.getItem('kwtNotifEnabled') === 'true'; } catch(e) { return false; }
            });

            useEffect(() => {
                if (typeof Notification === 'undefined') return;
                if (Notification.permission === 'granted') {
                    setNotifEnabled(true);
                    try { localStorage.setItem('kwtNotifEnabled', 'true'); } catch(e) {}
                } else if (Notification.permission === 'denied') {
                    setNotifEnabled(false);
                    try { localStorage.setItem('kwtNotifEnabled', 'false'); } catch(e) {}
                }
            }, []);

            const handleNotifToggle = async () => {
                if (typeof Notification === 'undefined') return;
                if (notifEnabled) {
                    setNotifEnabled(false);
                    try { localStorage.setItem('kwtNotifEnabled', 'false'); } catch(e) {}
                    return;
                }
                try {
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        setNotifEnabled(true);
                        try { localStorage.setItem('kwtNotifEnabled', 'true'); } catch(e) {}
                        new Notification('KWT News', {
                            body: 'Breaking news alerts enabled!',
